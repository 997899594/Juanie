name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository_owner }}/juanie
  ATLAS_VERSION: 1.1.0
  ATLAS_ACTION_VERSION: v1.1.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: ariga/setup-atlas@v0
        with:
          version: ${{ env.ATLAS_ACTION_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run db:hash
      - run: git diff --exit-code -- migrations/atlas.sum
      - run: bun run db:validate
      - run: bunx biome check
      - run: bun run lint
      - run: bun run ai:eval
      - run: bun run test
      - run: bun run build

  build-images:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [web, runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push ${{ matrix.target }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            ATLAS_VERSION=${{ env.ATLAS_VERSION }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ matrix.target }}-${{ github.sha }}
          cache-from: type=gha,scope=juanie-docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=juanie-docker-${{ matrix.target }}

  promote-gitops:
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Update Platform GitOps Values
        run: bun scripts/update-platform-gitops-values.ts

      - name: Commit Platform GitOps Revision
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- deploy/k8s/charts/juanie/values-gitops.yaml; then
            echo "GitOps values already point to ${COMMIT_SHA}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/charts/juanie/values-gitops.yaml
          git commit -m "chore(gitops): promote juanie ${COMMIT_SHA::7} [skip ci]"
          git push origin HEAD:main
