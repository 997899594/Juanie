name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository_owner }}/juanie
  ATLAS_VERSION: 1.2.3
  ATLAS_GRPC_VERSION: 1.82.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: v${{ env.ATLAS_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - name: Enforce Append-Only Migration Lineage
        env:
          MIGRATION_LINEAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run db:lineage "${MIGRATION_LINEAGE_BASE_SHA}"
      - run: bun run db:hash
      - run: git diff --exit-code -- migrations/atlas.sum migrations-contract/atlas.sum
      - run: bun run db:validate
      - run: bunx biome check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run ai:eval
      - run: bun run test
      - run: bun run build
      - name: Validate Production Helm Contract
        run: |
          ci_runtime_args=(
            --set-string env.JUANIE_SOURCE_REPOSITORY="${GITHUB_REPOSITORY}"
            --set-string env.JUANIE_SOURCE_REVISION="${GITHUB_SHA}"
          )
          helm lint deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            "${ci_runtime_args[@]}"
          rendered="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            "${ci_runtime_args[@]}")"
          printf '%s\n' "$rendered" | bun scripts/validate-scheduler-rbac.ts
          release_manifest="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            --show-only templates/release-manifest.yaml \
            "${ci_runtime_args[@]}")"
          grep -q "sourceRevision: \"${GITHUB_SHA}\"" <<<"$release_manifest"
          grep -q 'webImage: "ghcr.io/997899594/juanie:web-sha-f12feba"' <<<"$release_manifest"
          grep -q 'runtimeImage: "ghcr.io/997899594/juanie:runtime-sha-f12feba"' <<<"$release_manifest"
          grep -q 'schemaRunnerImage: "ghcr.io/997899594/juanie:schema-runner-sha-f12feba"' <<<"$release_manifest"
          test "$(grep -c '^kind: CronJob$' <<<"$rendered" || true)" -eq 0
          test "$(grep -c '^kind: PrometheusRule$' <<<"$rendered")" -eq 1
          test "$(grep -c '^kind: PodMonitor$' <<<"$rendered")" -eq 1
          test "$(grep -c '^kind: RestateDeployment$' <<<"$rendered")" -eq 1
          ! grep -q 'name: juanie-restate-register-' <<<"$rendered"
          ! grep -q 'juanie.art/restate-generation: legacy' <<<"$rendered"
          ! grep -q 'http://juanie-restate-services:9080' <<<"$rendered"
          ! grep -q 'control-plane-contract' <<<"$rendered"
          schema_release="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            --show-only templates/schema-sync-job.yaml \
            "${ci_runtime_args[@]}" \
            --set schemaSync.enabled=true)"
          test "$(grep -c '^kind: Job$' <<<"$schema_release")" -eq 1
          grep -q 'control-plane-expand' <<<"$schema_release"
          ! grep -q 'control-plane-contract' <<<"$schema_release"
          grep -q 'schema-runner-sha-f12feba' <<<"$schema_release"
          disaster_recovery="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            "${ci_runtime_args[@]}" \
            --set production.requireDisasterRecovery=true \
            --set backup.postgresql.enabled=true \
            --set backup.restateSnapshot.enabled=true \
            --set-string backup.postgresql.bucket=ci-control-plane-backups \
            --set-string backup.restateSnapshot.volumeSnapshotClassName=ci-snapshot-class)"
          test "$(grep -c '^kind: CronJob$' <<<"$disaster_recovery")" -ge 2
          external="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            "${ci_runtime_args[@]}" \
            --set production.durabilityMode=external \
            --set postgres.enabled=false \
            --set restate.embeddedEnabled=false \
            --set backup.postgresql.enabled=false \
            --set backup.restateSnapshot.enabled=false \
            --set-string env.DATABASE_HOST=postgres.example.internal \
            --set-string env.RESTATE_INGRESS_URL=https://restate.example.com \
            --set-string env.RESTATE_ADMIN_URL=https://restate-admin.example.com)"
          ! grep -q '^  name: postgres$' <<<"$external"
          external_restate="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            --show-only templates/restate.yaml \
            "${ci_runtime_args[@]}" \
            --set production.durabilityMode=external \
            --set postgres.enabled=false \
            --set restate.embeddedEnabled=false \
            --set backup.postgresql.enabled=false \
            --set backup.restateSnapshot.enabled=false \
            --set-string env.DATABASE_HOST=postgres.example.internal \
            --set-string env.RESTATE_INGRESS_URL=https://restate.example.com \
            --set-string env.RESTATE_ADMIN_URL=https://restate-admin.example.com)"
          ! grep -q '^kind: StatefulSet$' <<<"$external_restate"

      - name: Scan Source, Dependencies, And Secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: '1'

  plan-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      packages: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      plan: ${{ steps.plan.outputs.plan }}
      platform_required: ${{ steps.plan.outputs.platform_required }}
      operator_required: ${{ steps.plan.outputs.operator_required }}
      release_plan: ${{ steps.plan.outputs.release_plan }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve Last Successful Production Revision
        id: production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployments="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=production&per_page=100")"
          production_revision=none

          while IFS=$'\t' read -r deployment_id deployment_sha; do
            state="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" \
              | jq -r '.[0].state // empty')"
            if [ "${state}" = success ]; then
              production_revision="${deployment_sha}"
              break
            fi
          done < <(jq -r '.[] | [.id, .sha] | @tsv' <<<"${deployments}")

          if [ "${production_revision}" != none ]; then
            [[ "${production_revision}" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "${production_revision}^{commit}"
          fi
          echo "revision=${production_revision}" >> "${GITHUB_OUTPUT}"

      - name: Plan Component Images
        id: plan
        env:
          HEAD_REVISION: ${{ github.sha }}
          PRODUCTION_REVISION: ${{ steps.production.outputs.revision }}
        run: |
          set -euo pipefail
          plan='{"targets":[],"changedPaths":[],"reasons":[]}'
          registry_token="$(curl -fsS \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_REPOSITORY}:pull" \
            | jq -r .token)"

          registry_get() {
            path="$1"
            accept="$2"
            curl -LfsS \
              -H "Authorization: Bearer ${registry_token}" \
              -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${IMAGE_REPOSITORY}/${path}"
          }

          stable_revision() {
            target="$1"
            index="$(registry_get "manifests/${target}-stable" \
              'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json')" || return 1
            if jq -e '.manifests' <<<"$index" >/dev/null; then
              manifest_digest="$(jq -er '
                .manifests[] |
                select(.platform.os == "linux" and .platform.architecture == "amd64") |
                .digest
              ' <<<"$index" | head -n 1)" || return 1
              manifest="$(registry_get "manifests/${manifest_digest}" \
                'application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json')" || return 1
            else
              manifest="$index"
            fi
            config_digest="$(jq -er '.config.digest' <<<"$manifest")" || return 1
            config="$(registry_get "blobs/${config_digest}" \
              'application/vnd.oci.image.config.v1+json')" || return 1
            revision="$(jq -r \
              '.config.Labels["org.opencontainers.image.revision"] // empty' \
              <<<"$config")"
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || return 1
            printf '%s\n' "$revision"
          }

          for target in web runtime schema-runner; do
            if ! deployed_revision="$(stable_revision "$target")"; then
              plan="$(jq -c --arg target "$target" \
                '.targets = ((.targets + [$target]) | unique) |
                 .reasons += [$target + ": stable image metadata is unavailable"]' <<<"$plan")"
              continue
            fi

            target_plan="$(bun scripts/plan-platform-images.ts \
              "$deployed_revision" "$HEAD_REVISION")"
            plan="$(jq -c \
              --arg target "$target" \
              --argjson targetPlan "$target_plan" '
                .changedPaths = ((.changedPaths + $targetPlan.changedPaths) | unique) |
                if ($targetPlan.targets | index($target)) != null then
                  .targets = ((.targets + [$target]) | unique) |
                  .reasons += ($targetPlan.reasons | map($target + ": " + .))
                else
                  .
                end
              ' <<<"$plan")"
          done

          release_plan="$(bun scripts/plan-platform-release.ts \
            "${PRODUCTION_REVISION}" "${HEAD_REVISION}" "$(jq -c '.targets' <<<"${plan}")")"

          echo "targets=$(jq -c '.targets' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "plan=$(jq -c '.' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "platform_required=$(jq -r '.platformRequired' <<<"${release_plan}")" \
            >> "$GITHUB_OUTPUT"
          echo "operator_required=$(jq -r '.operatorRequired' <<<"${release_plan}")" \
            >> "$GITHUB_OUTPUT"
          echo "release_plan=$(jq -c '.' <<<"${release_plan}")" >> "$GITHUB_OUTPUT"
          {
            echo '### Platform image plan'
            echo '```json'
            jq '.' <<<"$plan"
            echo '```'
            echo '### Production release plan'
            echo '```json'
            jq '.' <<<"${release_plan}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: juanie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d juanie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: juanie
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL_MODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXTAUTH_SECRET: integration-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3001
      ENCRYPTION_MASTER_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      ENCRYPTION_MASTER_KEY_VERSION: 1
      RESTATE_INGRESS_URL: http://127.0.0.1:8080
      RESTATE_ADMIN_URL: http://127.0.0.1:9070
      RESTATE_SERVICE_PORT: 9080
      INTEGRATION_TESTS: 'true'
      RESTATE_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: v${{ env.ATLAS_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - name: Start Restate And Durable Services
        run: |
          set -euo pipefail
          docker run -d --name restate --network host restatedev/restate:1.7.2
          bun run start:restate-services > /tmp/restate-services.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9070/health >/dev/null \
              && curl --http2-prior-knowledge -fsS http://127.0.0.1:9080/health >/dev/null; then
              break
            fi
            test "${attempt}" -lt 60
            sleep 2
          done
          curl --fail-with-body -sS -X POST http://127.0.0.1:9070/deployments \
            -H 'content-type: application/json' \
            -d '{"uri":"http://127.0.0.1:9080"}'
      - run: bun run test:integration
      - name: Run Browser Golden Smoke
        run: |
          bunx playwright install --with-deps chromium
          bun run dev:web > /tmp/juanie-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health/startup >/dev/null; then break; fi
            test "${attempt}" -lt 60
            sleep 2
          done
          bun run test:e2e -- --project=chromium
      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-failure-artifacts
          path: |
            playwright-report
            test-results
            /tmp/restate-services.log
            /tmp/juanie-web.log

  build-images:
    needs: [quality, integration, plan-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target: [web, runtime, schema-runner]
    env:
      TARGET_ENABLED: ${{ contains(fromJSON(needs.plan-images.outputs.targets), matrix.target) }}
    steps:
      - if: env.TARGET_ENABLED == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - if: env.TARGET_ENABLED == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - if: env.TARGET_ENABLED == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push ${{ matrix.target }} Image
        if: env.TARGET_ENABLED == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            ATLAS_VERSION=${{ env.ATLAS_VERSION }}
            ATLAS_GRPC_VERSION=${{ env.ATLAS_GRPC_VERSION }}
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ matrix.target }}-${{ github.sha }}
          cache-from: type=gha,scope=juanie-docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=juanie-docker-${{ matrix.target }}

      - name: Install Cosign
        if: env.TARGET_ENABLED == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign Image With GitHub OIDC
        if: env.TARGET_ENABLED == 'true'
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan Published Image
        if: env.TARGET_ENABLED == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke Test Web Image Runtime
        if: env.TARGET_ENABLED == 'true' && matrix.target == 'web'
        env:
          WEB_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:web-${{ github.sha }}
        run: |
          set -euo pipefail

          docker pull "${WEB_IMAGE}"
          container="$(docker run -d -p 127.0.0.1:3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e HOSTNAME=0.0.0.0 \
            "${WEB_IMAGE}")"

          cleanup() {
            docker logs "${container}" || true
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health/startup >/dev/null; then
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              curl -fsS http://127.0.0.1:3001/api/health/startup
            fi

            sleep 2
          done

          docker exec "${container}" /usr/local/bin/bun -e "\
            require.resolve('next/package.json'); \
            require.resolve('@kubernetes/client-node/package.json'); \
            require.resolve('ws/package.json'); \
            console.log('web image runtime smoke ok');"

      - name: Smoke Test Schema Runner Toolchain
        if: env.TARGET_ENABLED == 'true' && matrix.target == 'schema-runner'
        env:
          SCHEMA_RUNNER_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:schema-runner-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/bun "${SCHEMA_RUNNER_IMAGE}" --version
          docker run --rm --entrypoint /usr/local/bin/node "${SCHEMA_RUNNER_IMAGE}" --version
          docker run --rm --entrypoint /usr/local/bin/node "${SCHEMA_RUNNER_IMAGE}" \
            /app/node_modules/corepack/dist/corepack.js --version
          docker run --rm --entrypoint /usr/local/bin/atlas "${SCHEMA_RUNNER_IMAGE}" version
          atlas_help="$(docker run --rm --entrypoint /usr/local/bin/atlas \
            "${SCHEMA_RUNNER_IMAGE}" migrate apply --help)"
          grep -F -- 'apply [flags] [amount]' <<<"${atlas_help}"
          grep -F -- '--exec-order' <<<"${atlas_help}"
          ! grep -F -- '--to-version' <<<"${atlas_help}"

  deploy-platform:
    needs: [build-images, plan-images]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.plan-images.outputs.platform_required == 'true' ||
      needs.plan-images.outputs.operator_required == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: production-platform
      cancel-in-progress: false
    environment: production
    permissions:
      contents: write
      packages: write
    env:
      DEPLOY_CHART_DIR: /tmp/juanie-direct-deploy-${{ github.sha }}/deploy/k8s/charts/juanie
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Publish Immutable Delivery Workflow Ref
        if: needs.plan-images.outputs.platform_required == 'true'
        run: |
          set -euo pipefail
          tag="juanie-ci-${GITHUB_SHA}"
          remote_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [ -n "${remote_sha}" ]; then
            test "${remote_sha}" = "${GITHUB_SHA}"
          else
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: needs.plan-images.outputs.platform_required == 'true'

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        if: needs.plan-images.outputs.platform_required == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: needs.plan-images.outputs.platform_required == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Load Restate Operator Lock
        if: needs.plan-images.outputs.operator_required == 'true'
        run: |
          set -euo pipefail
          lock=deploy/k8s/restate-operator.lock.json
          jq -e '
            (.version | type == "string" and length > 0) and
            (.chartDigest | test("^sha256:[a-f0-9]{64}$")) and
            (.chartSha256 | test("^[a-f0-9]{64}$")) and
            (.imageDigest | test("^sha256:[a-f0-9]{64}$")) and
            (.amd64Digest | test("^sha256:[a-f0-9]{64}$"))
          ' "${lock}" >/dev/null
          {
            echo "RESTATE_OPERATOR_VERSION=$(jq -er '.version' "${lock}")"
            echo "RESTATE_OPERATOR_CHART_DIGEST=$(jq -er '.chartDigest' "${lock}")"
            echo "RESTATE_OPERATOR_CHART_SHA256=$(jq -er '.chartSha256' "${lock}")"
            echo "RESTATE_OPERATOR_IMAGE_DIGEST=$(jq -er '.imageDigest' "${lock}")"
            echo "RESTATE_OPERATOR_AMD64_DIGEST=$(jq -er '.amd64Digest' "${lock}")"
          } >> "${GITHUB_ENV}"

      - name: Verify And Resolve Immutable Images
        if: needs.plan-images.outputs.platform_required == 'true'
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          PLAN_TARGETS: ${{ needs.plan-images.outputs.targets }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"

          resolve_component() {
            target="$1"
            output_name="$2"
            if jq -e --arg target "$target" 'index($target) != null' <<<"$PLAN_TARGETS" >/dev/null; then
              tag="${target}-${GITHUB_SHA}"
            else
              tag="${target}-stable"
            fi

            digest="$(docker buildx imagetools inspect \
              "${IMAGE}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            cosign verify "${IMAGE}@${digest}" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            echo "${output_name}=${tag}@${digest}" >> "${GITHUB_ENV}"
          }

          resolve_component web WEB_IMAGE_TAG
          resolve_component runtime RUNTIME_IMAGE_TAG
          resolve_component schema-runner SCHEMA_RUNNER_IMAGE_TAG

      - name: Upload Production Reconciler
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/k8s/charts/juanie,deploy/k8s/scripts/reconcile-production.sh
          target: /tmp/juanie-direct-deploy-${{ github.sha }}

      - name: Deploy Platform With Helm
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_CHART_DIR: ${{ env.DEPLOY_CHART_DIR }}
          DEPLOY_SCRIPT: /tmp/juanie-direct-deploy-${{ github.sha }}/deploy/k8s/scripts/reconcile-production.sh
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          WEB_IMAGE_TAG: ${{ env.WEB_IMAGE_TAG }}
          RUNTIME_IMAGE_TAG: ${{ env.RUNTIME_IMAGE_TAG }}
          SCHEMA_RUNNER_IMAGE_TAG: ${{ env.SCHEMA_RUNNER_IMAGE_TAG }}
          RESTATE_OPERATOR_VERSION: ${{ env.RESTATE_OPERATOR_VERSION }}
          RESTATE_OPERATOR_CHART_DIGEST: ${{ env.RESTATE_OPERATOR_CHART_DIGEST }}
          RESTATE_OPERATOR_CHART_SHA256: ${{ env.RESTATE_OPERATOR_CHART_SHA256 }}
          RESTATE_OPERATOR_IMAGE_DIGEST: ${{ env.RESTATE_OPERATOR_IMAGE_DIGEST }}
          RESTATE_OPERATOR_AMD64_DIGEST: ${{ env.RESTATE_OPERATOR_AMD64_DIGEST }}
          PLATFORM_DEPLOY_REQUIRED: ${{ needs.plan-images.outputs.platform_required }}
          OPERATOR_DEPLOY_REQUIRED: ${{ needs.plan-images.outputs.operator_required }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 70m
          envs: DEPLOY_CHART_DIR,DEPLOY_SCRIPT,GITHUB_SHA,GITHUB_REPOSITORY,IMAGE_REGISTRY,IMAGE_REPOSITORY,WEB_IMAGE_TAG,RUNTIME_IMAGE_TAG,SCHEMA_RUNNER_IMAGE_TAG,RESTATE_OPERATOR_VERSION,RESTATE_OPERATOR_CHART_DIGEST,RESTATE_OPERATOR_CHART_SHA256,RESTATE_OPERATOR_IMAGE_DIGEST,RESTATE_OPERATOR_AMD64_DIGEST,PLATFORM_DEPLOY_REQUIRED,OPERATOR_DEPLOY_REQUIRED
          script: bash "${DEPLOY_SCRIPT}"

      - name: Promote Deployed Component Channels
        if: needs.plan-images.outputs.platform_required == 'true'
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          PLAN_TARGETS: ${{ needs.plan-images.outputs.targets }}
        run: |
          set -euo pipefail

          promote_component() {
            target="$1"
            reference="$2"
            digest="${reference##*@}"
            docker buildx imagetools create \
              --tag "${IMAGE}:${target}-stable" \
              "${IMAGE}@${digest}"
            promoted_digest="$(docker buildx imagetools inspect \
              "${IMAGE}:${target}-stable" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test "$promoted_digest" = "$digest"
          }

          for target in web runtime schema-runner; do
            if ! jq -e --arg target "$target" 'index($target) != null' \
              <<<"$PLAN_TARGETS" >/dev/null; then
              continue
            fi

            case "$target" in
              web) reference="$WEB_IMAGE_TAG" ;;
              runtime) reference="$RUNTIME_IMAGE_TAG" ;;
              schema-runner) reference="$SCHEMA_RUNNER_IMAGE_TAG" ;;
            esac
            promote_component "$target" "$reference"
          done
