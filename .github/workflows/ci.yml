name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ${{ github.repository_owner }}/juanie
  ATLAS_VERSION: 1.2.0
  ATLAS_ACTION_VERSION: v1.2.0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: ${{ env.ATLAS_ACTION_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun audit --production
      - run: bun run db:hash
      - run: git diff --exit-code -- migrations/atlas.sum migrations-contract/atlas.sum
      - run: bun run db:validate
      - run: bunx biome check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run ai:eval
      - run: bun run test
      - run: bun run build
      - name: Validate Production Helm Contract
        run: |
          helm lint deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml
          rendered="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml)"
          test "$(grep -c '^kind: CronJob$' <<<"$rendered" || true)" -eq 0
          test "$(grep -c '^kind: PrometheusRule$' <<<"$rendered")" -eq 1
          ! grep -q 'control-plane-contract' <<<"$rendered"
          disaster_recovery="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            --set production.requireDisasterRecovery=true \
            --set backup.postgresql.enabled=true \
            --set backup.restateSnapshot.enabled=true \
            --set-string backup.postgresql.bucket=ci-control-plane-backups \
            --set-string backup.restateSnapshot.volumeSnapshotClassName=ci-snapshot-class)"
          test "$(grep -c '^kind: CronJob$' <<<"$disaster_recovery")" -ge 2
          external="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            --set production.durabilityMode=external \
            --set postgres.enabled=false \
            --set restate.embeddedEnabled=false \
            --set backup.postgresql.enabled=false \
            --set backup.restateSnapshot.enabled=false \
            --set-string env.DATABASE_HOST=postgres.example.internal \
            --set-string env.RESTATE_INGRESS_URL=https://restate.example.com \
            --set-string env.RESTATE_ADMIN_URL=https://restate-admin.example.com \
            --set-string env.RESTATE_SERVICE_REGISTRATION_URL=https://restate-services.example.com)"
          ! grep -q '^  name: postgres$' <<<"$external"
          external_restate="$(helm template juanie deploy/k8s/charts/juanie \
            -f deploy/k8s/charts/juanie/values-prod.yaml \
            --show-only templates/restate.yaml \
            --set production.durabilityMode=external \
            --set postgres.enabled=false \
            --set restate.embeddedEnabled=false \
            --set backup.postgresql.enabled=false \
            --set backup.restateSnapshot.enabled=false \
            --set-string env.DATABASE_HOST=postgres.example.internal \
            --set-string env.RESTATE_INGRESS_URL=https://restate.example.com \
            --set-string env.RESTATE_ADMIN_URL=https://restate-admin.example.com \
            --set-string env.RESTATE_SERVICE_REGISTRATION_URL=https://restate-services.example.com)"
          ! grep -q '^kind: StatefulSet$' <<<"$external_restate"

      - name: Scan Source, Dependencies, And Secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  integration:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: juanie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d juanie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_NAME: juanie
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_SSL_MODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      NEXTAUTH_SECRET: integration-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3001
      ENCRYPTION_MASTER_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      ENCRYPTION_MASTER_KEY_VERSION: 1
      RESTATE_INGRESS_URL: http://127.0.0.1:8080
      RESTATE_ADMIN_URL: http://127.0.0.1:9070
      RESTATE_SERVICE_PORT: 9080
      INTEGRATION_TESTS: 'true'
      RESTATE_INTEGRATION_TESTS: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0
        with:
          version: ${{ env.ATLAS_ACTION_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run db:push
      - name: Start Restate And Durable Services
        run: |
          set -euo pipefail
          docker run -d --name restate --network host restatedev/restate:1.7.2
          bun run start:restate-services > /tmp/restate-services.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9070/health >/dev/null \
              && curl --http2-prior-knowledge -fsS http://127.0.0.1:9080/health >/dev/null; then
              break
            fi
            test "${attempt}" -lt 60
            sleep 2
          done
          curl --fail-with-body -sS -X POST http://127.0.0.1:9070/deployments \
            -H 'content-type: application/json' \
            -d '{"uri":"http://127.0.0.1:9080"}'
      - run: bun run test:integration
      - name: Run Browser Golden Smoke
        run: |
          bunx playwright install --with-deps chromium
          bun run dev:web > /tmp/juanie-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health/startup >/dev/null; then break; fi
            test "${attempt}" -lt 60
            sleep 2
          done
          bun run test:e2e -- --project=chromium
      - name: Upload Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-failure-artifacts
          path: |
            playwright-report
            test-results
            /tmp/restate-services.log
            /tmp/juanie-web.log

  build-images:
    needs: [quality, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target: [web, runtime]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push ${{ matrix.target }} Image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            ATLAS_VERSION=${{ env.ATLAS_VERSION }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${{ matrix.target }}-${{ github.sha }}
          cache-from: type=gha,scope=juanie-docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=juanie-docker-${{ matrix.target }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign Image With GitHub OIDC
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan Published Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke Test Web Image Runtime
        if: matrix.target == 'web'
        env:
          WEB_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:web-${{ github.sha }}
        run: |
          set -euo pipefail

          docker pull "${WEB_IMAGE}"
          container="$(docker run -d -p 127.0.0.1:3001:3001 \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e HOSTNAME=0.0.0.0 \
            "${WEB_IMAGE}")"

          cleanup() {
            docker logs "${container}" || true
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health/startup >/dev/null; then
              break
            fi

            if [ "${attempt}" -eq 30 ]; then
              curl -fsS http://127.0.0.1:3001/api/health/startup
            fi

            sleep 2
          done

          docker exec "${container}" node -e "\
            require.resolve('next/package.json'); \
            require.resolve('@kubernetes/client-node/package.json'); \
            require.resolve('ws/package.json'); \
            console.log('web image runtime smoke ok');"

  deploy-platform:
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_CHART_DIR: /tmp/juanie-direct-deploy-${{ github.sha }}/deploy/k8s/charts/juanie
      WEB_IMAGE_TAG: web-${{ github.sha }}
      RUNTIME_IMAGE_TAG: runtime-${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Verify And Resolve Immutable Images
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main"
          web_digest="$(docker buildx imagetools inspect "${IMAGE}:${WEB_IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          runtime_digest="$(docker buildx imagetools inspect "${IMAGE}:${RUNTIME_IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign verify "${IMAGE}@${web_digest}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify "${IMAGE}@${runtime_digest}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "WEB_IMAGE_TAG=${WEB_IMAGE_TAG}@${web_digest}" >> "${GITHUB_ENV}"
          echo "RUNTIME_IMAGE_TAG=${RUNTIME_IMAGE_TAG}@${runtime_digest}" >> "${GITHUB_ENV}"

      - name: Upload Helm Chart
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/k8s/charts/juanie
          target: /tmp/juanie-direct-deploy-${{ github.sha }}

      - name: Deploy Platform With Helm
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          DEPLOY_CHART_DIR: ${{ env.DEPLOY_CHART_DIR }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          WEB_IMAGE_TAG: ${{ env.WEB_IMAGE_TAG }}
          RUNTIME_IMAGE_TAG: ${{ env.RUNTIME_IMAGE_TAG }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_CHART_DIR,GITHUB_SHA,IMAGE_REGISTRY,IMAGE_REPOSITORY,WEB_IMAGE_TAG,RUNTIME_IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail

            test -d "${DEPLOY_CHART_DIR}"
            kubectl -n argocd delete application juanie-platform --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
            kubectl -n juanie delete job juanie-schema-sync juanie-schema-expand juanie-schema-contract \
              --ignore-not-found=true >/dev/null 2>&1 || true

            helm upgrade --install juanie "${DEPLOY_CHART_DIR}" \
              --namespace juanie \
              --create-namespace \
              -f "${DEPLOY_CHART_DIR}/values-prod.yaml" \
              --set-string images.web.repository="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}" \
              --set-string images.web.tag="${WEB_IMAGE_TAG}" \
              --set-string images.runtime.repository="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}" \
              --set-string images.runtime.tag="${RUNTIME_IMAGE_TAG}" \
              --set schemaSync.enabled=true \
              --wait \
              --wait-for-jobs \
              --timeout 20m

            kubectl -n juanie rollout status deployment/juanie-web --timeout=10m
            kubectl -n juanie rollout status deployment/juanie-worker --timeout=10m
            for attempt in $(seq 1 24); do
              if curl -fsS https://juanie.art/api/health/ready >/dev/null; then
                break
              fi

              if [ "${attempt}" -eq 24 ]; then
                curl -fsS https://juanie.art/api/health/ready
              fi

              sleep 5
            done
            rm -rf "/tmp/juanie-direct-deploy-${GITHUB_SHA}"
