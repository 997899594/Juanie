name: Juanie Application Delivery

on:
  workflow_dispatch:
    inputs:
      source_provider:
        description: Bound source provider
        required: true
        type: choice
        options: [github, gitlab, gitlab-self-hosted]
      source_repository:
        description: Bound source repository
        required: true
        type: string
      source_ref:
        description: Logical source ref
        required: true
        type: string
      source_sha:
        description: Immutable source commit SHA
        required: true
        type: string
      before_sha:
        description: Previous source commit SHA
        required: false
        type: string
      delivery_id:
        description: Provider event or platform request id
        required: true
        type: string
      force_full_build:
        description: Build the complete declared graph
        required: false
        default: false
        type: boolean

concurrency:
  group: juanie-delivery-${{ inputs.delivery_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JUANIE_BASE_URL: https://juanie.art
  JUANIE_REPOSITORY: ${{ inputs.source_repository }}
  JUANIE_PROVIDER: ${{ inputs.source_provider }}
  JUANIE_EXECUTOR_PROVIDER: github
  JUANIE_EXTERNAL_RUN_ID: ${{ inputs.delivery_id }}
  JUANIE_SOURCE_SHA: ${{ inputs.source_sha }}
  JUANIE_RELEASE_REF: ${{ inputs.source_ref }}
  JUANIE_BEFORE_SHA: ${{ inputs.before_sha }}
  JUANIE_FORCE_FULL_BUILD: ${{ inputs.force_full_build }}
  JUANIE_RUNTIME_DIR: /tmp/juanie-ci-runtime-v1
  JUANIE_BUILD_STATE_DIR: /tmp/juanie-build-run
  JUANIE_TURBO_CACHE_DIR: /tmp/juanie-turbo-cache
  JUANIE_BUILD_RUN_SHA256: a37b5019dd47e046559bb9980ec19996cca8122d8a607fa322cd49ad8e168fd0
  JUANIE_DELIVERY_SHA256: 7f7e8b61d62c10a152314c7e0d4058839b79e60dc85ff3dd00a6e13c66929154
  JUANIE_IDENTITY_SHA256: 41e570b4dfb648595a3c1c642591bd6f50ba073374e08d7edebb34d889fd293d

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      build_run_id: ${{ steps.plan.outputs.build_run_id }}
      groups: ${{ steps.plan.outputs.groups }}
      deliverables: ${{ steps.plan.outputs.deliverables }}
    steps:
      - name: Download immutable Juanie CI runtime
        run: |
          set -euo pipefail
          mkdir -p "$JUANIE_RUNTIME_DIR" "$JUANIE_BUILD_STATE_DIR"
          for asset in build-run.sh workload-identity.sh; do
            curl --fail --silent --show-error \
              "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
              --output "${JUANIE_RUNTIME_DIR}/${asset}"
          done
          chmod +x "$JUANIE_RUNTIME_DIR"/*
          cd "$JUANIE_RUNTIME_DIR"
          printf '%s  %s\n' \
            "$JUANIE_BUILD_RUN_SHA256" build-run.sh \
            "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
            | sha256sum -c -

      - name: Resolve commit-scoped analysis policy
        run: bash "$JUANIE_RUNTIME_DIR/build-run.sh" prepare

      - name: Materialize immutable source lineage
        run: |
          set -euo pipefail
          source "$JUANIE_RUNTIME_DIR/workload-identity.sh"
          token="$(acquire_juanie_ci_token)"
          download_juanie_source_archive "$token" "$RUNNER_TEMP/source-head.tar.gz"

          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          if [ "$(jq -r '.policy.mode' "$JUANIE_BUILD_STATE_DIR/analysis-policy.json")" = 'turbo' ]; then
            if download_juanie_source_archive \
              "$token" \
              "$RUNNER_TEMP/source-base.tar.gz" \
              "$JUANIE_BEFORE_SHA"; then
              tar -xzf "$RUNNER_TEMP/source-base.tar.gz" \
                --strip-components=1 -C "$GITHUB_WORKSPACE"
              git init --quiet
              git config user.name juanie-ci
              git config user.email ci@juanie.art
              git add --all
              git commit --quiet --allow-empty -m "Juanie base ${JUANIE_BEFORE_SHA}"
              find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              tar -xzf "$RUNNER_TEMP/source-head.tar.gz" \
                --strip-components=1 -C "$GITHUB_WORKSPACE"
              git add --all
              git commit --quiet --allow-empty -m "Juanie head ${JUANIE_SOURCE_SHA}"
            else
              echo 'Base source snapshot could not be materialized' \
                > "$JUANIE_BUILD_STATE_DIR/turbo-analysis-error"
              tar -xzf "$RUNNER_TEMP/source-head.tar.gz" \
                --strip-components=1 -C "$GITHUB_WORKSPACE"
            fi
          else
            tar -xzf "$RUNNER_TEMP/source-head.tar.gz" \
              --strip-components=1 -C "$GITHUB_WORKSPACE"
          fi

      - name: Create commit-scoped build plan
        id: plan
        run: |
          set -euo pipefail
          bash "$JUANIE_RUNTIME_DIR/build-run.sh" start
          echo "build_run_id=$(cat "$JUANIE_BUILD_STATE_DIR/build-run-id")" >> "$GITHUB_OUTPUT"
          {
            echo 'groups<<JUANIE_GROUPS'
            cat "$JUANIE_BUILD_STATE_DIR/groups.json"
            echo 'JUANIE_GROUPS'
            echo 'deliverables<<JUANIE_DELIVERABLES'
            cat "$JUANIE_BUILD_STATE_DIR/deliverables.json"
            echo 'JUANIE_DELIVERABLES'
          } >> "$GITHUB_OUTPUT"

      - name: Remove synthetic source history
        run: rm -rf .git

      - name: Persist source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juanie-source-${{ steps.plan.outputs.build_run_id }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Persist build plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juanie-build-run-${{ steps.plan.outputs.build_run_id }}
          path: ${{ env.JUANIE_BUILD_STATE_DIR }}
          if-no-files-found: error
          retention-days: 1

  build:
    needs: plan
    if: ${{ needs.plan.outputs.groups != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juanie-source-${{ needs.plan.outputs.build_run_id }}
          path: .

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: ${{ env.JUANIE_BUILD_STATE_DIR }}

      - name: Restore service-scoped Turbo cache
        if: ${{ matrix.group.mode == 'affected_matrix' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.JUANIE_TURBO_CACHE_DIR }}
          key: juanie-turbo-${{ inputs.source_repository }}-${{ matrix.group.id }}-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}-${{ inputs.source_sha }}
          restore-keys: juanie-turbo-${{ inputs.source_repository }}-${{ matrix.group.id }}-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/pnpm-lock.yaml', '**/yarn.lock', '**/package-lock.json') }}-

      - name: Download immutable Juanie CI runtime
        run: |
          set -euo pipefail
          mkdir -p "$JUANIE_RUNTIME_DIR"
          for asset in build-run.sh workload-identity.sh; do
            curl --fail --silent --show-error \
              "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
              --output "${JUANIE_RUNTIME_DIR}/${asset}"
          done
          chmod +x "$JUANIE_RUNTIME_DIR"/*
          cd "$JUANIE_RUNTIME_DIR"
          printf '%s  %s\n' \
            "$JUANIE_BUILD_RUN_SHA256" build-run.sh \
            "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
            | sha256sum -c -

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push group
        env:
          JUANIE_BUILD_RUN_ID: ${{ needs.plan.outputs.build_run_id }}
          JUANIE_BUILD_GROUP_JSON: ${{ toJson(matrix.group) }}
          JUANIE_DOCKER_CACHE_BACKEND: gha
        run: bash "$JUANIE_RUNTIME_DIR/build-run.sh" build-group

  release:
    needs: [plan, build]
    if: ${{ always() && (needs.plan.outputs.groups == '[]' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      artifacts_ready: ${{ steps.release.outputs.artifacts_ready }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: ${{ env.JUANIE_BUILD_STATE_DIR }}

      - name: Download immutable Juanie CI runtime
        run: |
          set -euo pipefail
          mkdir -p "$JUANIE_RUNTIME_DIR"
          for asset in build-run.sh workload-identity.sh; do
            curl --fail --silent --show-error \
              "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
              --output "${JUANIE_RUNTIME_DIR}/${asset}"
          done
          chmod +x "$JUANIE_RUNTIME_DIR"/*
          cd "$JUANIE_RUNTIME_DIR"
          printf '%s  %s\n' \
            "$JUANIE_BUILD_RUN_SHA256" build-run.sh \
            "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
            | sha256sum -c -

      - name: Finalize aggregate release
        id: release
        env:
          JUANIE_BUILD_RUN_ID: ${{ needs.plan.outputs.build_run_id }}
        run: |
          set -euo pipefail
          bash "$JUANIE_RUNTIME_DIR/build-run.sh" finalize
          echo "release_id=$(cat "$JUANIE_BUILD_STATE_DIR/release-id")" >> "$GITHUB_OUTPUT"
          echo "artifacts_ready=$(cat "$JUANIE_BUILD_STATE_DIR/artifacts-ready")" >> "$GITHUB_OUTPUT"

  deliver:
    needs: [plan, release]
    if: ${{ needs.plan.outputs.deliverables != '[]' && needs.release.outputs.artifacts_ready == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        deliverable: ${{ fromJson(needs.plan.outputs.deliverables) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: ${{ env.JUANIE_BUILD_STATE_DIR }}

      - name: Download immutable Juanie CI runtime
        run: |
          set -euo pipefail
          mkdir -p "$JUANIE_RUNTIME_DIR"
          for asset in delivery-artifacts.sh workload-identity.sh; do
            curl --fail --silent --show-error \
              "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
              --output "${JUANIE_RUNTIME_DIR}/${asset}"
          done
          chmod +x "$JUANIE_RUNTIME_DIR"/*
          cd "$JUANIE_RUNTIME_DIR"
          printf '%s  %s\n' \
            "$JUANIE_DELIVERY_SHA256" delivery-artifacts.sh \
            "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
            | sha256sum -c -

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract delivery artifact
        id: delivery
        env:
          JUANIE_RELEASE_ID: ${{ needs.release.outputs.release_id }}
          JUANIE_DELIVERY_STORAGE_MODE: github_actions
        run: |
          set -euo pipefail
          printf '%s' '${{ toJson(matrix.deliverable) }}' | jq -c '[.]' > "$RUNNER_TEMP/juanie-deliverable.json"
          export JUANIE_BUILD_OUTPUTS_JSON="$(cat "$JUANIE_BUILD_STATE_DIR/build-outputs.json")"
          JUANIE_DELIVERABLES_FILE="$RUNNER_TEMP/juanie-deliverable.json" \
            bash "$JUANIE_RUNTIME_DIR/delivery-artifacts.sh"

      - name: Upload delivery artifact
        id: upload
        if: ${{ steps.delivery.outputs.has_delivery_artifacts == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: juanie-delivery-${{ needs.release.outputs.release_id }}-${{ strategy.job-index }}
          path: ${{ steps.delivery.outputs.upload_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Register delivery artifact
        if: ${{ steps.delivery.outputs.has_delivery_artifacts == 'true' }}
        env:
          JUANIE_RELEASE_ID: ${{ needs.release.outputs.release_id }}
          JUANIE_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          JUANIE_DELIVERY_MANIFEST: ${{ steps.delivery.outputs.manifest }}
        run: |
          set -euo pipefail
          payload="$(
            jq -cn \
              --arg repository "$JUANIE_REPOSITORY" \
              --arg artifactUrl "$JUANIE_ARTIFACT_URL" \
              --slurpfile manifest "$JUANIE_DELIVERY_MANIFEST" \
              '{repository: $repository, artifacts: ($manifest[0] | map(. + {uri: $artifactUrl} | del(.path)))}'
          )"
          source "$JUANIE_RUNTIME_DIR/workload-identity.sh"
          juanie_api_json POST "/api/releases/${JUANIE_RELEASE_ID}/artifacts" "$payload"

  complete:
    needs: [plan, release, deliver]
    if: ${{ always() && needs.plan.outputs.deliverables != '[]' && needs.release.result == 'success' && needs.deliver.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: ${{ env.JUANIE_BUILD_STATE_DIR }}

      - name: Download immutable Juanie CI runtime
        run: |
          set -euo pipefail
          mkdir -p "$JUANIE_RUNTIME_DIR"
          for asset in build-run.sh workload-identity.sh; do
            curl --fail --silent --show-error \
              "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
              --output "${JUANIE_RUNTIME_DIR}/${asset}"
          done
          chmod +x "$JUANIE_RUNTIME_DIR"/*
          cd "$JUANIE_RUNTIME_DIR"
          printf '%s  %s\n' \
            "$JUANIE_BUILD_RUN_SHA256" build-run.sh \
            "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
            | sha256sum -c -

      - name: Complete delivery aggregate
        env:
          JUANIE_BUILD_RUN_ID: ${{ needs.plan.outputs.build_run_id }}
          JUANIE_DELIVERY_RESULT: ${{ needs.deliver.result }}
        run: bash "$JUANIE_RUNTIME_DIR/build-run.sh" complete-delivery

  settle:
    needs: [plan, build, release, deliver, complete]
    if: ${{ always() && (needs.plan.result == 'failure' || needs.plan.result == 'cancelled' || needs.build.result == 'failure' || needs.build.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download immutable Juanie CI runtime
        run: |
          set -euo pipefail
          mkdir -p "$JUANIE_RUNTIME_DIR"
          for asset in build-run.sh workload-identity.sh; do
            curl --fail --silent --show-error \
              "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
              --output "${JUANIE_RUNTIME_DIR}/${asset}"
          done
          chmod +x "$JUANIE_RUNTIME_DIR"/*
          cd "$JUANIE_RUNTIME_DIR"
          printf '%s  %s\n' \
            "$JUANIE_BUILD_RUN_SHA256" build-run.sh \
            "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
            | sha256sum -c -

      - name: Settle failed CI-owned delivery phase
        env:
          JUANIE_PLAN_RESULT: ${{ needs.plan.result }}
          JUANIE_BUILD_RESULT: ${{ needs.build.result }}
        run: bash "$JUANIE_RUNTIME_DIR/build-run.sh" fail
