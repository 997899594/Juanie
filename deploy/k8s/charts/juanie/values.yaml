# 默认配置（开发环境）
# images.web.tag / images.runtime.tag 是 chart 渲染占位值；生产或客户部署必须
# 覆盖为 CI 已构建的完整 commit SHA tag，例如 web-${SHA} / runtime-${SHA}。
images:
  web:
    repository: ghcr.io/997899594/juanie
    pullPolicy: IfNotPresent
    tag: "web-sha-f12feba"
  runtime:
    repository: ghcr.io/997899594/juanie
    pullPolicy: IfNotPresent
    tag: "runtime-sha-f12feba"
  busybox:
    repository: busybox
    pullPolicy: IfNotPresent
    tag: "1.36"
  postgres:
    repository: pgvector/pgvector
    pullPolicy: IfNotPresent
    tag: "pg16"
  redis:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "7-alpine"

imagePullSecrets: []

namespace: juanie

# 副本数
replicaCount:
  web: 1
  worker: 1
  scheduler: 1

worker:
  runScheduler: false
  insecureSkipTlsVerify: false

scheduler:
  insecureSkipTlsVerify: false

schemaSync:
  enabled: false
  backoffLimit: 0
  ttlSecondsAfterFinished: 600

rbac:
  create: true
  allowPodExec: false
  allowSecretMutation: true
  extraRules: []

deployment:
  progressDeadlineSeconds: 900
  revisionHistoryLimit: 5
  web:
    strategy:
      type: RollingUpdate
      maxSurge: 0
      maxUnavailable: 1
  worker:
    strategy:
      type: RollingUpdate
      maxSurge: 0
      maxUnavailable: 1
  scheduler:
    strategy:
      type: Recreate

# 资源配置
resources:
  web:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  worker:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  scheduler:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# 环境变量（非敏感）
env:
  NODE_ENV: "production"
  PORT: 3001
  REDIS_HOST: "redis"
  REDIS_PORT: 6379
  DATABASE_HOST: "postgres"
  DATABASE_PORT: 5432
  DATABASE_NAME: "juanie"
  DATABASE_USER: "postgres"
  DATABASE_SSL_MODE: "disable"
  AUTH_TRUST_HOST: "true"
  # Trust the Kubernetes ServiceAccount CA so Node-based platform workers can
  # verify the in-cluster Kubernetes API certificate without disabling TLS.
  NODE_EXTRA_CA_CERTS: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
  # Optional outbound proxy for GitHub OAuth, Git provider APIs, AI providers,
  # and artifact storage in restricted networks. Node 24 fetch only honors these
  # variables when NODE_USE_ENV_PROXY is enabled.
  NODE_USE_ENV_PROXY: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""
  JUANIE_BASE_DOMAIN: "juanie.art"
  JUANIE_ARGOCD_NAMESPACE: "argocd"
  JUANIE_ARGOCD_PROJECT: "juanie"
  JUANIE_ARGOCD_DESTINATION_SERVER: "https://kubernetes.default.svc"
  JUANIE_PREVIEW_APPLICATIONSET_ENABLED: "false"
  JUANIE_PREVIEW_APPLICATIONSET_REPO_URL: ""
  JUANIE_PREVIEW_APPLICATIONSET_TARGET_REVISION: "main"
  JUANIE_PREVIEW_APPLICATIONSET_PATH: "deploy/k8s/charts/preview-scaffold"
  GITLAB_URL: ""
  AI_302_BASE_URL: "https://api.302ai.cn/v1"
  AI_DEFAULT_PLAN: "free"
  AI_MODEL: "gpt-5.2"
  AI_MODEL_PRO: "gpt-5.2-pro"
  AI_MODEL_TOOL: "gpt-5.2"
  FEISHU_ALLOWED_EMAIL_DOMAINS: ""
  ARTIFACT_STORAGE_ENDPOINT: ""
  ARTIFACT_STORAGE_REGION: "auto"
  ARTIFACT_STORAGE_FORCE_PATH_STYLE: "false"
  ARTIFACT_DOWNLOAD_TTL_SECONDS: "300"
  BYTEBASE_ENABLED: "false"
  BYTEBASE_URL: ""
  BYTEBASE_SQL_EDITOR_PATH: "/sql-editor"
  BYTEBASE_ACCESS_MODE_LABEL: "只读优先"
  BYTEBASE_SUMMARY: "用于查询、排障和浏览结构；发布迁移仍走 Juanie + Atlas 主链"
  BYTEBASE_CHANGE_MANAGEMENT_SUMMARY: "DDL/DML 不在控制台直接放行，结构变更回到发布、提升或修复流程"
  BYTEBASE_DATABASE_URL_TEMPLATE: ""

# Gateway 配置
hostname: "juanie.art"
gateway:
  enabled: true
  name: shared-gateway
  namespace: juanie
  route:
    sectionName: https-apex
  redirect:
    enabled: true
    sectionName: http-apex

# 数据库配置
postgres:
  storage: "10Gi"

redis:
  storage: "1Gi"

# 敏感配置
secret:
  existingSecret: "juanie-secret"
  databasePassword: ""
  nextauthSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  gitlabClientId: ""
  gitlabClientSecret: ""
  feishuClientId: ""
  feishuClientSecret: ""
  ai302ApiKey: ""
  bytebaseApiToken: ""
  bytebaseServiceAccountEmail: ""
  bytebaseServiceAccountKey: ""
  bytebaseBootstrapEmail: ""
  bytebaseBootstrapPassword: ""
  bytebaseBootstrapTitle: "Juanie Platform"
  bytebaseOidcClientId: "bytebase"
  bytebaseOidcClientSecret: ""
  bytebaseOidcIssuer: ""
  artifactStorageAccessKeyId: ""
  artifactStorageSecretAccessKey: ""
  atlasDevUrl: ""
  atlasDevUrlPostgresql: ""
  atlasDevUrlMysql: ""

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  targetName: ""
  data: []
  dataFrom: []
