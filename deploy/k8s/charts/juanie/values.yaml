# 默认配置（开发环境）
# 应用镜像 tag 是 chart 渲染占位值；生产或客户部署必须覆盖为 CI 已构建的
# 完整 commit SHA tag，例如 web-${SHA} / runtime-${SHA} / schema-runner-${SHA}。
images:
  web:
    repository: ghcr.io/997899594/juanie
    pullPolicy: IfNotPresent
    tag: "web-sha-f12feba"
  runtime:
    repository: ghcr.io/997899594/juanie
    pullPolicy: IfNotPresent
    tag: "runtime-sha-f12feba"
  schemaRunner:
    repository: ghcr.io/997899594/juanie
    pullPolicy: IfNotPresent
    tag: "schema-runner-sha-f12feba"
  busybox:
    repository: busybox
    pullPolicy: IfNotPresent
    tag: "1.36"
    digest: "sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662"
  postgres:
    repository: pgvector/pgvector
    pullPolicy: IfNotPresent
    tag: "pg17"
    digest: "sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb"
  redis:
    repository: redis
    pullPolicy: IfNotPresent
    tag: "7-alpine"
    digest: "sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99"
  restate:
    repository: docker.io/restatedev/restate
    pullPolicy: IfNotPresent
    tag: "1.7.2"
    digest: "sha256:1b87ca71fafcf8af350e59d9e0164e1f5161a313fc4e65f3ee4143d0a4eac400"
imagePullSecrets: []

namespace: juanie

production:
  enabled: false
  topologyMode: singleNode
  durabilityMode: selfHosted
  requireDisasterRecovery: false

# 副本数
replicaCount:
  web: 1
  worker: 1
  scheduler: 1
  restateHandler: 1
  outboxDispatcher: 1

worker:
  insecureSkipTlsVerify: false

scheduler:
  insecureSkipTlsVerify: false

schemaSync:
  enabled: false
  backoffLimit: 0
  ttlSecondsAfterFinished: 600

restate:
  embeddedEnabled: true
  storage: "10Gi"
  handler:
    drainDelaySeconds: 300
    revisionHistoryLimit: 10

backup:
  postgresql:
    enabled: false
    schedule: "17 2 * * *"
    bucket: ""
    prefix: "backups/control-plane"
    retentionDays: 30
  restateSnapshot:
    enabled: false
    schedule: "47 2 * * *"
    volumeSnapshotClassName: ""
    retentionCount: 7

rbac:
  create: true
  allowPodExec: false
  allowSecretMutation: true
  extraRules: []

deployment:
  progressDeadlineSeconds: 900
  revisionHistoryLimit: 5
  web:
    strategy:
      type: RollingUpdate
      maxSurge: 0
      maxUnavailable: 1
  worker:
    strategy:
      type: RollingUpdate
      maxSurge: 0
      maxUnavailable: 1
  scheduler:
    strategy:
      type: Recreate

# 资源配置
resources:
  web:
    requests:
      cpu: 100m
      memory: 256Mi
  restateHandler:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  outboxDispatcher:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  restate:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  worker:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  scheduler:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# 环境变量（非敏感）
env:
  NODE_ENV: "production"
  PORT: 3001
  REDIS_HOST: "redis"
  REDIS_PORT: 6379
  DATABASE_HOST: "postgres"
  DATABASE_PORT: 5432
  DATABASE_NAME: "juanie"
  DATABASE_USER: "postgres"
  DATABASE_SSL_MODE: "disable"
  RESTATE_INGRESS_URL: "http://juanie-restate:8080"
  RESTATE_ADMIN_URL: "http://juanie-restate:9070"
  RESTATE_SERVICE_PORT: "9080"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ""
  AUTH_TRUST_HOST: "true"
  # Optional outbound proxy for GitHub OAuth, Git provider APIs, AI providers,
  # and artifact storage in restricted networks. Node 24 fetch only honors these
  # variables when NODE_USE_ENV_PROXY is enabled.
  NODE_USE_ENV_PROXY: ""
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: ""
  JUANIE_BASE_DOMAIN: "juanie.art"
  JUANIE_SOURCE_REPOSITORY: "997899594/Juanie"
  JUANIE_SOURCE_REVISION: "main"
  JUANIE_WORKLOAD_REGISTRY: "ghcr.io/997899594/juanie-workload"
  JUANIE_ARGOCD_NAMESPACE: "argocd"
  JUANIE_ARGOCD_PROJECT: "juanie"
  JUANIE_ARGOCD_DESTINATION_SERVER: "https://kubernetes.default.svc"
  JUANIE_PREVIEW_APPLICATIONSET_ENABLED: "false"
  JUANIE_PREVIEW_APPLICATIONSET_REPO_URL: ""
  JUANIE_PREVIEW_APPLICATIONSET_TARGET_REVISION: "main"
  JUANIE_PREVIEW_APPLICATIONSET_PATH: "deploy/k8s/charts/preview-scaffold"
  GITLAB_URL: ""
  AI_302_BASE_URL: "https://api.302ai.cn/v1"
  AI_DEFAULT_PLAN: "free"
  AI_MODEL: "gpt-5.2"
  AI_MODEL_PRO: "gpt-5.2-pro"
  AI_MODEL_TOOL: "gpt-5.2"
  FEISHU_ALLOWED_EMAIL_DOMAINS: ""
  ARTIFACT_STORAGE_ENDPOINT: ""
  ARTIFACT_STORAGE_REGION: "auto"
  ARTIFACT_STORAGE_BUCKET: ""
  ARTIFACT_STORAGE_FORCE_PATH_STYLE: "false"
  ARTIFACT_DOWNLOAD_TTL_SECONDS: "300"
  DATABASE_CONSOLE_ENABLED: "true"
  DATABASE_CONSOLE_LABEL: "DbGate"
  DATABASE_CONSOLE_ACCESS_MODE_LABEL: "只读优先"
  DATABASE_CONSOLE_SUMMARY: "用于浏览表结构、预览数据和临时查询；迁移仍走 Juanie + Atlas 主链"
  DATABASE_CONSOLE_CHANGE_MANAGEMENT_SUMMARY: "默认以只读工作台打开，结构变更回到发布、提升或修复流程"
  DATABASE_CONSOLE_READONLY: "true"
  DATABASE_CONSOLE_ROUTE_NAMESPACE: "juanie"
  DATABASE_CONSOLE_GATEWAY_SERVICE_NAME: "juanie-web"
  DATABASE_CONSOLE_TOKEN_TTL_SECONDS: "3600"
  DBGATE_NAMESPACE: ""
  DBGATE_HOSTNAME_BASE_DOMAIN: "juanie.art"
  DBGATE_IMAGE: "dbgate/dbgate:7.2.0"
  DBGATE_CPU_REQUEST: "50m"
  DBGATE_CPU_LIMIT: "500m"
  DBGATE_MEMORY_REQUEST: "128Mi"
  DBGATE_MEMORY_LIMIT: "512Mi"
  DBGATE_IDLE_TTL_MINUTES: "60"
  DBGATE_CONSOLE_CLEANUP_SCHEDULE: "*/15 * * * *"
  AI_TASK_RECONCILIATION_SCHEDULE: "* * * * *"
  OUTBOX_DELIVERED_RETENTION_DAYS: "14"
  OUTBOX_RESOLVED_DEAD_LETTER_RETENTION_DAYS: "30"

# Gateway 配置
hostname: "juanie.art"
gateway:
  enabled: true
  name: shared-gateway
  namespace: juanie
  route:
    sectionName: https-apex
  redirect:
    enabled: true
    sectionName: http-apex

# 数据库配置
postgres:
  enabled: true
  storage: "10Gi"

redis:
  storage: "1Gi"

applicationDelivery:
  preflight:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 300

# 敏感配置
secret:
  existingSecret: "juanie-secret"
  databasePassword: ""
  nextauthSecret: ""
  encryptionMasterKey: ""
  encryptionMasterKeyVersion: "1"
  metricsBearerToken: ""
  githubClientId: ""
  githubClientSecret: ""
  juanieGithubAppId: ""
  juanieGithubAppInstallationId: ""
  juanieGithubAppPrivateKey: ""
  juanieSourceWebhookSecret: ""
  gitlabClientId: ""
  gitlabClientSecret: ""
  feishuClientId: ""
  feishuClientSecret: ""
  ai302ApiKey: ""
  artifactStorageAccessKeyId: ""
  artifactStorageSecretAccessKey: ""
  atlasDevUrl: ""
  atlasDevUrlPostgresql: ""
  atlasDevUrlMysql: ""
  componentKeys:
    web:
      - DATABASE_PASSWORD
      - NEXTAUTH_SECRET
      - ENCRYPTION_MASTER_KEY
      - ENCRYPTION_MASTER_KEY_VERSION
      - METRICS_BEARER_TOKEN
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - JUANIE_GITHUB_APP_ID
      - JUANIE_GITHUB_APP_INSTALLATION_ID
      - JUANIE_GITHUB_APP_PRIVATE_KEY
      - JUANIE_SOURCE_WEBHOOK_SECRET
      - GITLAB_CLIENT_ID
      - GITLAB_CLIENT_SECRET
      - FEISHU_CLIENT_ID
      - FEISHU_CLIENT_SECRET
      - AI_302_API_KEY
      - ARTIFACT_STORAGE_ACCESS_KEY_ID
      - ARTIFACT_STORAGE_SECRET_ACCESS_KEY
    worker:
      - DATABASE_PASSWORD
      - ENCRYPTION_MASTER_KEY
      - ENCRYPTION_MASTER_KEY_VERSION
      - JUANIE_GITHUB_APP_ID
      - JUANIE_GITHUB_APP_INSTALLATION_ID
      - JUANIE_GITHUB_APP_PRIVATE_KEY
      - JUANIE_SOURCE_WEBHOOK_SECRET
      - AI_302_API_KEY
      - ARTIFACT_STORAGE_ACCESS_KEY_ID
      - ARTIFACT_STORAGE_SECRET_ACCESS_KEY
      - ATLAS_DEV_URL
      - ATLAS_DEV_URL_POSTGRESQL
      - ATLAS_DEV_URL_MYSQL
    scheduler:
      - DATABASE_PASSWORD
      - ENCRYPTION_MASTER_KEY
      - ENCRYPTION_MASTER_KEY_VERSION
      - JUANIE_GITHUB_APP_ID
      - JUANIE_GITHUB_APP_INSTALLATION_ID
      - JUANIE_GITHUB_APP_PRIVATE_KEY
      - JUANIE_SOURCE_WEBHOOK_SECRET
    restateHandler:
      - DATABASE_PASSWORD
      - ENCRYPTION_MASTER_KEY
      - ENCRYPTION_MASTER_KEY_VERSION
      - GITHUB_CLIENT_ID
      - GITHUB_CLIENT_SECRET
      - JUANIE_GITHUB_APP_ID
      - JUANIE_GITHUB_APP_INSTALLATION_ID
      - JUANIE_GITHUB_APP_PRIVATE_KEY
      - JUANIE_SOURCE_WEBHOOK_SECRET
      - GITLAB_CLIENT_ID
      - GITLAB_CLIENT_SECRET
      - ARTIFACT_STORAGE_ACCESS_KEY_ID
      - ARTIFACT_STORAGE_SECRET_ACCESS_KEY
      - ATLAS_DEV_URL
      - ATLAS_DEV_URL_POSTGRESQL
      - ATLAS_DEV_URL_MYSQL
    outbox:
      - DATABASE_PASSWORD
    schemaRunner:
      - DATABASE_PASSWORD
      - ENCRYPTION_MASTER_KEY
      - ENCRYPTION_MASTER_KEY_VERSION
      - ARTIFACT_STORAGE_ACCESS_KEY_ID
      - ARTIFACT_STORAGE_SECRET_ACCESS_KEY
      - ATLAS_DEV_URL
      - ATLAS_DEV_URL_POSTGRESQL
      - ATLAS_DEV_URL_MYSQL
    backup:
      - DATABASE_PASSWORD
      - ARTIFACT_STORAGE_ACCESS_KEY_ID
      - ARTIFACT_STORAGE_SECRET_ACCESS_KEY

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  targetName: ""
  data: []
  dataFrom: []

monitoring:
  prometheusRule:
    enabled: false
    namespace: ""
    labels: {}
  podMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
