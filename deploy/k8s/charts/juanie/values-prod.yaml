# 生产环境覆盖配置
production:
  enabled: true
  durabilityMode: selfHosted
  requireDisasterRecovery: false

replicaCount:
  web: 2
  worker: 2
  scheduler: 2
  restateServices: 2
  outboxDispatcher: 2

worker:
  insecureSkipTlsVerify: false

deployment:
  progressDeadlineSeconds: 1200
  revisionHistoryLimit: 3
  web:
    strategy:
      type: RollingUpdate
      maxSurge: 1
      maxUnavailable: 0
  worker:
    strategy:
      type: RollingUpdate
      maxSurge: 1
      maxUnavailable: 0
  scheduler:
    strategy:
      type: RollingUpdate

resources:
  web:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  worker:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi
  scheduler:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi
  restateServices:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi
  outboxDispatcher:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  restate:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi

env:
  JUANIE_BASE_DOMAIN: "juanie.art"
  JUANIE_ARGOCD_NAMESPACE: "argocd"
  JUANIE_ARGOCD_PROJECT: "juanie"
  JUANIE_ARGOCD_DESTINATION_SERVER: "https://kubernetes.default.svc"
  JUANIE_PREVIEW_APPLICATIONSET_ENABLED: "false"
  JUANIE_PREVIEW_APPLICATIONSET_REPO_URL: "https://github.com/997899594/Juanie.git"
  JUANIE_PREVIEW_APPLICATIONSET_TARGET_REVISION: "main"
  JUANIE_PREVIEW_APPLICATIONSET_PATH: "deploy/k8s/charts/preview-scaffold"
  AI_ENABLED: "true"
  DATABASE_CONSOLE_ENABLED: "true"
  DATABASE_CONSOLE_READONLY: "true"
  DATABASE_CONSOLE_ROUTE_NAMESPACE: "juanie"
  DATABASE_CONSOLE_GATEWAY_SERVICE_NAME: "juanie-web"
  DBGATE_HOSTNAME_BASE_DOMAIN: "juanie.art"

monitoring:
  prometheusRule:
    enabled: true
  podMonitor:
    enabled: true
