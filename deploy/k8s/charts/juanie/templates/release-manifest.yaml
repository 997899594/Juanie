apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-platform-release
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: platform-release
    app.kubernetes.io/managed-by: Helm
data:
  sourceRepository: {{ .Values.env.JUANIE_SOURCE_REPOSITORY | quote }}
  sourceRevision: {{ .Values.env.JUANIE_SOURCE_REVISION | quote }}
  webImage: {{ include "juanie.image" .Values.images.web | quote }}
  runtimeImage: {{ include "juanie.image" .Values.images.runtime | quote }}
  schemaRunnerImage: {{ include "juanie.image" .Values.images.schemaRunner | quote }}
