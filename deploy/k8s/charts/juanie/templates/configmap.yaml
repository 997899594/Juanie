apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  REDIS_HOST: {{ .Values.env.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.env.REDIS_PORT | quote }}
  DATABASE_HOST: {{ .Values.env.DATABASE_HOST | quote }}
  DATABASE_PORT: {{ .Values.env.DATABASE_PORT | quote }}
  DATABASE_NAME: {{ .Values.env.DATABASE_NAME | quote }}
  DATABASE_USER: {{ .Values.env.DATABASE_USER | default "postgres" | quote }}
  DATABASE_SSL_MODE: {{ .Values.env.DATABASE_SSL_MODE | default "disable" | quote }}
  AUTH_TRUST_HOST: {{ .Values.env.AUTH_TRUST_HOST | default "true" | quote }}
  {{- with .Values.env.NODE_EXTRA_CA_CERTS }}
  NODE_EXTRA_CA_CERTS: {{ . | quote }}
  {{- end }}
  {{- if or .Values.env.HTTP_PROXY .Values.env.HTTPS_PROXY .Values.env.ALL_PROXY }}
  NODE_USE_ENV_PROXY: {{ .Values.env.NODE_USE_ENV_PROXY | default "1" | quote }}
  {{- end }}
  {{- with .Values.env.HTTP_PROXY }}
  HTTP_PROXY: {{ . | quote }}
  {{- end }}
  {{- with .Values.env.HTTPS_PROXY }}
  HTTPS_PROXY: {{ . | quote }}
  {{- end }}
  {{- with .Values.env.ALL_PROXY }}
  ALL_PROXY: {{ . | quote }}
  {{- end }}
  {{- if or .Values.env.NO_PROXY .Values.env.HTTP_PROXY .Values.env.HTTPS_PROXY .Values.env.ALL_PROXY }}
  NO_PROXY: {{ .Values.env.NO_PROXY | default "localhost,127.0.0.1,.svc,.cluster.local,postgres,redis,kubernetes.default.svc" | quote }}
  {{- end }}
  JUANIE_BASE_DOMAIN: {{ .Values.env.JUANIE_BASE_DOMAIN | default "juanie.art" | quote }}
  JUANIE_ARGOCD_NAMESPACE: {{ .Values.env.JUANIE_ARGOCD_NAMESPACE | default "argocd" | quote }}
  JUANIE_ARGOCD_PROJECT: {{ .Values.env.JUANIE_ARGOCD_PROJECT | default "juanie" | quote }}
  JUANIE_ARGOCD_DESTINATION_SERVER: {{ .Values.env.JUANIE_ARGOCD_DESTINATION_SERVER | default "https://kubernetes.default.svc" | quote }}
  JUANIE_PREVIEW_APPLICATIONSET_ENABLED: {{ .Values.env.JUANIE_PREVIEW_APPLICATIONSET_ENABLED | default "false" | quote }}
  JUANIE_PREVIEW_APPLICATIONSET_REPO_URL: {{ .Values.env.JUANIE_PREVIEW_APPLICATIONSET_REPO_URL | default "" | quote }}
  JUANIE_PREVIEW_APPLICATIONSET_TARGET_REVISION: {{ .Values.env.JUANIE_PREVIEW_APPLICATIONSET_TARGET_REVISION | default "main" | quote }}
  JUANIE_PREVIEW_APPLICATIONSET_PATH: {{ .Values.env.JUANIE_PREVIEW_APPLICATIONSET_PATH | default "deploy/k8s/charts/preview-scaffold" | quote }}
  {{- with .Values.env.GITLAB_URL }}
  GITLAB_URL: {{ . | quote }}
  {{- end }}
  JUANIE_GATEWAY_NAME: {{ .Values.gateway.name | default "shared-gateway" | quote }}
  JUANIE_GATEWAY_NAMESPACE: {{ .Values.gateway.namespace | default .Values.namespace | quote }}
  JUANIE_GATEWAY_APEX_SECTION_NAME: {{ .Values.gateway.route.sectionName | default "https-apex" | quote }}
  JUANIE_GATEWAY_WILDCARD_SECTION_NAME: {{ .Values.gateway.wildcardSectionName | default "https-wildcard" | quote }}
  {{- if hasKey .Values.env "AI_ENABLED" }}
  AI_ENABLED: {{ .Values.env.AI_ENABLED | quote }}
  {{- end }}
  AI_302_BASE_URL: {{ .Values.env.AI_302_BASE_URL | default "https://api.302ai.cn/v1" | quote }}
  AI_DEFAULT_PLAN: {{ .Values.env.AI_DEFAULT_PLAN | default "free" | quote }}
  AI_MODEL: {{ .Values.env.AI_MODEL | default "gpt-5.2" | quote }}
  AI_MODEL_PRO: {{ .Values.env.AI_MODEL_PRO | default "gpt-5.2-pro" | quote }}
  AI_MODEL_TOOL: {{ .Values.env.AI_MODEL_TOOL | default "gpt-5.2" | quote }}
  FEISHU_ALLOWED_EMAIL_DOMAINS: {{ .Values.env.FEISHU_ALLOWED_EMAIL_DOMAINS | default "" | quote }}
  ARTIFACT_STORAGE_ENDPOINT: {{ .Values.env.ARTIFACT_STORAGE_ENDPOINT | default "" | quote }}
  ARTIFACT_STORAGE_REGION: {{ .Values.env.ARTIFACT_STORAGE_REGION | default "auto" | quote }}
  ARTIFACT_STORAGE_BUCKET: {{ .Values.env.ARTIFACT_STORAGE_BUCKET | default "" | quote }}
  ARTIFACT_STORAGE_FORCE_PATH_STYLE: {{ .Values.env.ARTIFACT_STORAGE_FORCE_PATH_STYLE | default "false" | quote }}
  ARTIFACT_DOWNLOAD_TTL_SECONDS: {{ .Values.env.ARTIFACT_DOWNLOAD_TTL_SECONDS | default "300" | quote }}
  DATABASE_CONSOLE_ENABLED: {{ .Values.env.DATABASE_CONSOLE_ENABLED | default "true" | quote }}
  DATABASE_CONSOLE_LABEL: {{ .Values.env.DATABASE_CONSOLE_LABEL | default "DbGate" | quote }}
  DATABASE_CONSOLE_ACCESS_MODE_LABEL: {{ .Values.env.DATABASE_CONSOLE_ACCESS_MODE_LABEL | default "只读优先" | quote }}
  DATABASE_CONSOLE_SUMMARY: {{ .Values.env.DATABASE_CONSOLE_SUMMARY | default "用于浏览表结构、预览数据和临时查询；迁移仍走 Juanie + Atlas 主链" | quote }}
  DATABASE_CONSOLE_CHANGE_MANAGEMENT_SUMMARY: {{ .Values.env.DATABASE_CONSOLE_CHANGE_MANAGEMENT_SUMMARY | default "默认以只读工作台打开，结构变更回到发布、提升或修复流程" | quote }}
  DATABASE_CONSOLE_READONLY: {{ .Values.env.DATABASE_CONSOLE_READONLY | default "true" | quote }}
  DBGATE_NAMESPACE: {{ .Values.env.DBGATE_NAMESPACE | default .Values.namespace | quote }}
  DBGATE_IMAGE: {{ .Values.env.DBGATE_IMAGE | default "dbgate/dbgate:7.2.0" | quote }}
  DBGATE_CPU_REQUEST: {{ .Values.env.DBGATE_CPU_REQUEST | default "50m" | quote }}
  DBGATE_CPU_LIMIT: {{ .Values.env.DBGATE_CPU_LIMIT | default "500m" | quote }}
  DBGATE_MEMORY_REQUEST: {{ .Values.env.DBGATE_MEMORY_REQUEST | default "128Mi" | quote }}
  DBGATE_MEMORY_LIMIT: {{ .Values.env.DBGATE_MEMORY_LIMIT | default "512Mi" | quote }}
  DBGATE_IDLE_TTL_MINUTES: {{ .Values.env.DBGATE_IDLE_TTL_MINUTES | default "60" | quote }}
  DBGATE_CONSOLE_CLEANUP_SCHEDULE: {{ .Values.env.DBGATE_CONSOLE_CLEANUP_SCHEDULE | default "*/15 * * * *" | quote }}
  JUANIE_NAMESPACE: {{ .Values.namespace | quote }}
  SCHEMA_RUNNER_IMAGE_REPOSITORY: {{ .Values.images.runtime.repository | quote }}
  SCHEMA_RUNNER_IMAGE_TAG: {{ .Values.images.runtime.tag | quote }}
