{{- if .Values.production.enabled }}
{{- if not .Values.monitoring.prometheusRule.enabled }}
{{- fail "production requires monitoring.prometheusRule.enabled=true" }}
{{- end }}
{{- if not (regexMatch "^[^/[:space:]]+/[^/[:space:]]+$" .Values.env.JUANIE_SOURCE_REPOSITORY) }}
{{- fail "production requires env.JUANIE_SOURCE_REPOSITORY as a GitHub owner/repository pair" }}
{{- end }}
{{- if not (regexMatch "^[a-f0-9]{40}$" .Values.env.JUANIE_SOURCE_REVISION) }}
{{- fail "production requires env.JUANIE_SOURCE_REVISION as an immutable 40-character commit SHA" }}
{{- end }}
{{- if not .Values.monitoring.podMonitor.enabled }}
{{- fail "production requires monitoring.podMonitor.enabled=true" }}
{{- end }}
{{- if not (has .Values.production.topologyMode (list "singleNode" "highAvailability")) }}
{{- fail "production.topologyMode must be singleNode or highAvailability" }}
{{- end }}
{{- if eq .Values.production.durabilityMode "selfHosted" }}
{{- if or (not .Values.postgres.enabled) (not .Values.restate.embeddedEnabled) }}
{{- fail "self-hosted production requires embedded PostgreSQL and Restate" }}
{{- end }}
{{- if .Values.production.requireDisasterRecovery }}
{{- if not .Values.backup.postgresql.enabled }}
{{- fail "self-hosted production requires backup.postgresql.enabled=true" }}
{{- end }}
{{- if empty (.Values.backup.postgresql.bucket | default .Values.env.ARTIFACT_STORAGE_BUCKET) }}
{{- fail "self-hosted production requires a PostgreSQL backup bucket" }}
{{- end }}
{{- if not .Values.backup.restateSnapshot.enabled }}
{{- fail "self-hosted production requires backup.restateSnapshot.enabled=true" }}
{{- end }}
{{- if empty .Values.backup.restateSnapshot.volumeSnapshotClassName }}
{{- fail "self-hosted production requires a Restate VolumeSnapshotClass" }}
{{- end }}
{{- end }}
{{- else if eq .Values.production.durabilityMode "external" }}
{{- if or .Values.postgres.enabled .Values.restate.embeddedEnabled }}
{{- fail "external production durability must disable embedded PostgreSQL and Restate" }}
{{- end }}
{{- if or (eq .Values.env.DATABASE_HOST "postgres") (eq .Values.env.RESTATE_INGRESS_URL "http://juanie-restate:8080") (eq .Values.env.RESTATE_SERVICE_REGISTRATION_URL "http://juanie-restate-services:9080") }}
{{- fail "external production durability requires external PostgreSQL and Restate endpoints" }}
{{- end }}
{{- else }}
{{- fail "production.durabilityMode must be selfHosted or external" }}
{{- end }}
{{- if eq .Values.production.topologyMode "singleNode" }}
{{- if or (ne (int .Values.replicaCount.web) 1) (ne (int .Values.replicaCount.worker) 1) (ne (int .Values.replicaCount.scheduler) 1) (ne (int .Values.replicaCount.restateServices) 1) (ne (int .Values.replicaCount.outboxDispatcher) 1) }}
{{- fail "singleNode production requires exactly one replica for every control-plane component" }}
{{- end }}
{{- else }}
{{- if or (lt (int .Values.replicaCount.web) 2) (lt (int .Values.replicaCount.worker) 2) (lt (int .Values.replicaCount.scheduler) 2) (lt (int .Values.replicaCount.restateServices) 2) (lt (int .Values.replicaCount.outboxDispatcher) 2) }}
{{- fail "highAvailability production requires at least two replicas for every control-plane component" }}
{{- end }}
{{- end }}
{{- end }}
