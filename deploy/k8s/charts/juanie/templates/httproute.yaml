{{- if .Values.gateway.enabled }}
# HTTPS 路由
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name | default "shared-gateway" }}
      namespace: {{ .Values.gateway.namespace | default .Values.namespace }}
      sectionName: {{ .Values.gateway.route.sectionName | default "https-apex" }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Chart.Name }}-web
          port: 80
          weight: 1
{{- if .Values.gateway.redirect.enabled }}
---
# HTTP 到 HTTPS 重定向
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-redirect
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name | default "shared-gateway" }}
      namespace: {{ .Values.gateway.namespace | default .Values.namespace }}
      sectionName: {{ .Values.gateway.redirect.sectionName | default "http-apex" }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
