  strategy:
    type: {{ .Values.deployment.worker.strategy.type }}
    {{- if eq .Values.deployment.worker.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ .Values.deployment.worker.strategy.maxSurge }}
      maxUnavailable: {{ .Values.deployment.worker.strategy.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ .Chart.Name }}-worker
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: {{ include "juanie.image" .Values.images.busybox | quote }}
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ .Values.env.DATABASE_HOST }} {{ .Values.env.DATABASE_PORT }}; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: wait-for-redis
          image: {{ include "juanie.image" .Values.images.busybox | quote }}
          imagePullPolicy: {{ .Values.images.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: {{ include "juanie.image" .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          command: ["./worker"]
          env:
          {{- if .Values.worker.insecureSkipTlsVerify }}
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
          {{- end }}
            {{- include "juanie.secretEnv" (dict "root" . "keys" .Values.secret.componentKeys.worker) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-config
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
