{{- if and .Values.production.enabled .Values.applicationDelivery.preflight.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Chart.Name }}-application-delivery-preflight
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: application-delivery-preflight
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.applicationDelivery.preflight.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.applicationDelivery.preflight.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.applicationDelivery.preflight.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: application-delivery-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application-delivery-preflight
          image: {{ include "juanie.image" .Values.images.runtime | quote }}
          imagePullPolicy: {{ .Values.images.runtime.pullPolicy }}
          command: ["./application-delivery-preflight"]
          env:
            - name: JUANIE_PUBLIC_ORIGIN
              value: {{ printf "https://%s" .Values.hostname | quote }}
            - name: JUANIE_SOURCE_REPOSITORY
              value: {{ .Values.env.JUANIE_SOURCE_REPOSITORY | quote }}
            - name: JUANIE_SOURCE_REVISION
              value: {{ .Values.env.JUANIE_SOURCE_REVISION | quote }}
            - name: JUANIE_GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "juanie.effectiveSecretName" . }}
                  key: JUANIE_GITHUB_APP_ID
            - name: JUANIE_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "juanie.effectiveSecretName" . }}
                  key: JUANIE_GITHUB_APP_PRIVATE_KEY
            - name: JUANIE_GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "juanie.effectiveSecretName" . }}
                  key: JUANIE_GITHUB_APP_INSTALLATION_ID
                  optional: true
          resources:
            {{- toYaml .Values.resources.outboxDispatcher | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
