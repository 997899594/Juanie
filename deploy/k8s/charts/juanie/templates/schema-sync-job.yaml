{{- define "juanie.schemaSyncJob" -}}
{{- $root := .root -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Chart.Name }}-schema-{{ .phase }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $root.Chart.Name }}
    app.kubernetes.io/component: schema-{{ .phase }}
  annotations:
    helm.sh/hook: {{ .hook }}
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $root.Values.schemaSync.backoffLimit }}
  ttlSecondsAfterFinished: {{ $root.Values.schemaSync.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $root.Chart.Name }}
        app.kubernetes.io/component: schema-{{ .phase }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $root.Chart.Name }}-schema-runner
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-postgres
          image: {{ include "juanie.image" $root.Values.images.busybox | quote }}
          imagePullPolicy: {{ $root.Values.images.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ $root.Values.env.DATABASE_HOST }} {{ $root.Values.env.DATABASE_PORT }}; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: schema-{{ .phase }}
          image: {{ include "juanie.image" $root.Values.images.schemaRunner | quote }}
          imagePullPolicy: {{ $root.Values.images.schemaRunner.pullPolicy }}
          command: ["./schema-runner", "control-plane-{{ .phase }}"]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            {{- include "juanie.secretEnv" (dict "root" $root "keys" $root.Values.secret.componentKeys.schemaRunner) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $root.Chart.Name }}-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if .Values.schemaSync.enabled }}
{{ include "juanie.schemaSyncJob" (dict "root" . "phase" "expand" "hook" "pre-install,pre-upgrade" "weight" "-10") }}
{{- end }}
