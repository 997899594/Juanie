{{- define "juanie.schemaSyncJob" -}}
{{- $root := .root -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $root.Chart.Name }}-schema-{{ .nameSuffix }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $root.Chart.Name }}
    app.kubernetes.io/component: schema-{{ .phase }}
    {{- with .promotionEpoch }}
    juanie.art/schema-contract-epoch: {{ . | quote }}
    {{- end }}
  {{- with .hook }}
  annotations:
    helm.sh/hook: {{ . }}
    helm.sh/hook-weight: {{ $.weight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ $root.Values.schemaSync.backoffLimit }}
  ttlSecondsAfterFinished: {{ $root.Values.schemaSync.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $root.Chart.Name }}
        app.kubernetes.io/component: schema-{{ .phase }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ if eq .phase "contract" }}{{ $root.Chart.Name }}-schema-runner{{ else }}default{{ end }}
      automountServiceAccountToken: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      initContainers:
        - name: wait-for-postgres
          image: {{ include "juanie.image" $root.Values.images.busybox | quote }}
          imagePullPolicy: {{ $root.Values.images.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ $root.Values.env.DATABASE_HOST }} {{ $root.Values.env.DATABASE_PORT }}; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: schema-{{ .phase }}
          image: {{ include "juanie.image" $root.Values.images.schemaRunner | quote }}
          imagePullPolicy: {{ $root.Values.images.schemaRunner.pullPolicy }}
          command: ["./schema-runner", "control-plane-{{ .phase }}"]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            {{- with .promotionEpoch }}
            - name: CONTROL_PLANE_CONTRACT_PROMOTION
              value: {{ . | quote }}
            {{- end }}
            {{- include "juanie.secretEnv" (dict "root" $root "keys" $root.Values.secret.componentKeys.schemaRunner) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $root.Chart.Name }}-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}

{{- if .Values.schemaSync.enabled }}
{{ include "juanie.schemaSyncJob" (dict "root" . "phase" "expand" "nameSuffix" "expand" "hook" "pre-install,pre-upgrade" "weight" "-10") }}
{{- end }}

{{- with .Values.schemaSync.contractPromotionEpoch }}
{{- if not (regexMatch "^[0-9]{8}$" .) }}
{{- fail "schemaSync.contractPromotionEpoch must be an 8-digit epoch" }}
{{- end }}
---
{{ include "juanie.schemaSyncJob" (dict "root" $ "phase" "contract" "nameSuffix" (printf "contract-%s" .) "promotionEpoch" .) }}
{{- end }}
