apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: __JUANIE_PLATFORM_GITOPS_APPLICATION_NAME__
  namespace: __JUANIE_ARGOCD_NAMESPACE__
  labels:
    app.kubernetes.io/name: juanie
    app.kubernetes.io/component: platform
    app.kubernetes.io/managed-by: juanie-bootstrap
spec:
  project: __JUANIE_ARGOCD_PROJECT_NAME__
  source:
    repoURL: __JUANIE_PLATFORM_GITOPS_REPO_URL__
    targetRevision: __JUANIE_PLATFORM_GITOPS_TARGET_REVISION__
    path: deploy/k8s/charts/juanie
    helm:
      releaseName: juanie
      valueFiles:
        - values-prod.yaml
        - values-gitops.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: __JUANIE_PLATFORM_NAMESPACE__
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .metadata.labels."app.kubernetes.io/managed-by"
        - .metadata.annotations."meta.helm.sh/release-name"
        - .metadata.annotations."meta.helm.sh/release-namespace"
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].status
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - .metadata.labels."app.kubernetes.io/managed-by"
        - .metadata.annotations."meta.helm.sh/release-name"
        - .metadata.annotations."meta.helm.sh/release-namespace"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
