spec:
  inputs:
    juanie_base_url:
      type: string
      description: Immutable Juanie control-plane origin
---

juanie:build:
  stage: .pre
  image: docker:24
  services:
    - docker:24-dind
  id_tokens:
    JUANIE_OIDC_TOKEN:
      aud: juanie-ci
  variables:
    JUANIE_BASE_URL: $[[ inputs.juanie_base_url ]]
    JUANIE_IMAGE_REGISTRY: $CI_REGISTRY
    JUANIE_BUILD_STATE_DIR: $CI_PROJECT_DIR/.juanie-ci-state/build-run
    JUANIE_CHANGE_OUTPUT_DIR: $CI_PROJECT_DIR/.juanie-ci-state/changes
    JUANIE_BUILD_RUN_SHA256: 618a5dfd13ad94ad66c22861929e8e177ad91f777c9b95e6cf9f5eb277901d7d
    JUANIE_CHANGES_SHA256: cda4e87914de1e3f24497376e64538e175a447cb4feafffc2a8859acd368bfc6
    JUANIE_DELIVERY_SHA256: 409891525ff7f1f029ee7c6e402c312db778a74d53e15bed8cbbf770437e1659
    JUANIE_IDENTITY_SHA256: ca3db3a2d115d27a2497e007e3c3caf1cd707d5d072f2b266f71a38b64c6bd2b
  before_script:
    - apk add --no-cache bash curl git jq nodejs npm ruby tar zip
    - mkdir -p .juanie-ci-state/runtime .juanie-ci-state/changes
    - |
      for asset in build-run.sh changes.mjs delivery-artifacts.sh workload-identity.sh; do
        curl --fail --silent --show-error \
          "${JUANIE_BASE_URL}/api/ci/runtime/v1/${asset}" \
          --output ".juanie-ci-state/runtime/${asset}"
      done
    - chmod +x .juanie-ci-state/runtime/*.sh .juanie-ci-state/runtime/*.mjs
    - |
      cd .juanie-ci-state/runtime
      printf '%s  %s\n' \
        "$JUANIE_BUILD_RUN_SHA256" build-run.sh \
        "$JUANIE_CHANGES_SHA256" changes.mjs \
        "$JUANIE_DELIVERY_SHA256" delivery-artifacts.sh \
        "$JUANIE_IDENTITY_SHA256" workload-identity.sh \
        | sha256sum -c -
      cd "$CI_PROJECT_DIR"
  script:
    - |
      set -euo pipefail
      export JUANIE_SOURCE_SHA="${JUANIE_SOURCE_SHA:-$CI_COMMIT_SHA}"
      export JUANIE_RELEASE_REF="${JUANIE_RELEASE_REF:-$CI_COMMIT_REF_NAME}"
      export JUANIE_REPOSITORY="$CI_PROJECT_PATH"
      if [ "$CI_SERVER_URL" = 'https://gitlab.com' ]; then
        export JUANIE_PROVIDER=gitlab
      else
        export JUANIE_PROVIDER=gitlab-self-hosted
      fi
      export JUANIE_EXTERNAL_RUN_ID="$CI_PIPELINE_ID"

      node .juanie-ci-state/runtime/changes.mjs
      export JUANIE_CHANGED_FILES_JSON="$(cat .juanie-ci-state/changes/changed-files.json)"
      if [ -f .juanie-ci-state/changes/affected-packages.json ]; then
        export JUANIE_AFFECTED_PACKAGES_JSON="$(cat .juanie-ci-state/changes/affected-packages.json)"
      fi
      export JUANIE_FORCE_FULL_BUILD="$(cat .juanie-ci-state/changes/force-full-build)"

      bash .juanie-ci-state/runtime/build-run.sh start
      if [ "$(jq length .juanie-ci-state/build-run/groups.json)" -eq 0 ]; then
        touch .juanie-ci-state/no-work
        exit 0
      fi

      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      bash .juanie-ci-state/runtime/build-run.sh build-all
      bash .juanie-ci-state/runtime/build-run.sh finalize
  artifacts:
    paths:
      - .juanie-ci-state
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE

juanie:deliver:
  stage: .pre
  image: docker:24
  services:
    - docker:24-dind
  id_tokens:
    JUANIE_OIDC_TOKEN:
      aud: juanie-ci
  needs:
    - job: juanie:build
      artifacts: true
  variables:
    JUANIE_BASE_URL: $[[ inputs.juanie_base_url ]]
    JUANIE_PROVIDER: gitlab
    JUANIE_BUILD_STATE_DIR: $CI_PROJECT_DIR/.juanie-ci-state/build-run
  before_script:
    - apk add --no-cache bash curl jq ruby tar zip
  script:
    - |
      set -euo pipefail
      if [ -f .juanie-ci-state/no-work ]; then exit 0; fi
      if [ "$(cat .juanie-ci-state/build-run/artifacts-ready)" != 'true' ]; then exit 0; fi

      export JUANIE_SOURCE_SHA="${JUANIE_SOURCE_SHA:-$CI_COMMIT_SHA}"
      export JUANIE_RELEASE_REF="${JUANIE_RELEASE_REF:-$CI_COMMIT_REF_NAME}"
      export JUANIE_REPOSITORY="$CI_PROJECT_PATH"
      if [ "$CI_SERVER_URL" = 'https://gitlab.com' ]; then
        export JUANIE_PROVIDER=gitlab
      else
        export JUANIE_PROVIDER=gitlab-self-hosted
      fi
      export JUANIE_EXTERNAL_RUN_ID="$CI_PIPELINE_ID"
      export JUANIE_RELEASE_ID="$(cat .juanie-ci-state/build-run/release-id)"
      export JUANIE_BUILD_OUTPUTS_JSON="$(cat .juanie-ci-state/build-run/build-outputs.json)"
      export JUANIE_DELIVERABLES_FILE=.juanie-ci-state/build-run/deliverables.json

      if [ "$(jq length "$JUANIE_DELIVERABLES_FILE")" -eq 0 ]; then exit 0; fi
      docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      bash .juanie-ci-state/runtime/delivery-artifacts.sh
  rules:
    - if: $CI_PIPELINE_SOURCE
