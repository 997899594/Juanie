name: Juanie CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      juanie_source_sha:
        description: Source commit SHA to build
        required: false
        type: string
      juanie_release_ref:
        description: Logical release ref to send back to Juanie
        required: false
        type: string
      juanie_force_full_build:
        description: Build all services for preview startup
        required: false
        type: string

env:
  IMAGE_REGISTRY: ghcr.io
  JUANIE_SOURCE_SHA: ${{ inputs.juanie_source_sha || github.sha }}
  JUANIE_RELEASE_REF: ${{ inputs.juanie_release_ref || github.ref }}
  JUANIE_FORCE_FULL_BUILD: ${{ inputs.juanie_force_full_build || 'false' }}
  JUANIE_SERVICE_MATRIX_B64: {{JUANIE_SERVICE_MATRIX_B64}}
  JUANIE_DELIVERABLE_MATRIX_B64: {{JUANIE_DELIVERABLE_MATRIX_B64}}
  JUANIE_AFFECTED_RULES_B64: {{JUANIE_AFFECTED_RULES_B64}}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      deliverables: ${{ steps.detect.outputs.deliverables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - name: Detect affected services
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execSync } = require('node:child_process');

          const services = JSON.parse(
            Buffer.from(process.env.JUANIE_SERVICE_MATRIX_B64 ?? '', 'base64').toString('utf8')
          );
          const deliverables = JSON.parse(
            Buffer.from(process.env.JUANIE_DELIVERABLE_MATRIX_B64 ?? '', 'base64').toString('utf8')
          );
          const affectedRules = JSON.parse(
            Buffer.from(process.env.JUANIE_AFFECTED_RULES_B64 ?? '', 'base64').toString('utf8')
          );
          const serviceDirs = services.map((service) => service.appDir);
          const deliverableDirs = deliverables.map((deliverable) => deliverable.appDir);
          const globalInputs = affectedRules.global ?? [];
          const sharedInputs = affectedRules.inputs ?? [];
          const globalPrefixes = ['.github/', '.gitlab/'];
          const beforeSha = process.env.BEFORE_SHA;
          const sourceSha = process.env.JUANIE_SOURCE_SHA;
          const fullBuild =
            process.env.JUANIE_FORCE_FULL_BUILD === 'true' ||
            !beforeSha ||
            /^0+$/.test(beforeSha);
          let changedFiles = [];

          if (!fullBuild) {
            const output = execSync(`git diff --name-only ${beforeSha} ${sourceSha}`, {
              encoding: 'utf8',
            });
            changedFiles = output.split('\n').map((line) => line.trim()).filter(Boolean);
          }

          const matchesInput = (file, pattern) => {
            if (!pattern) return false;
            if (pattern.endsWith('/**')) return file.startsWith(pattern.slice(0, -2));
            if (pattern.endsWith('/*')) {
              const prefix = pattern.slice(0, -1);
              return file.startsWith(prefix) && !file.slice(prefix.length).includes('/');
            }
            if (pattern.endsWith('/')) return file.startsWith(pattern);
            return file === pattern;
          };

          const matchesAnyInput = (file, patterns) =>
            patterns.some((pattern) => matchesInput(file, pattern));

          const isSharedInputFile = (file) =>
            matchesAnyInput(file, sharedInputs) &&
            ![...serviceDirs, ...deliverableDirs].some(
              (appDir) => file === appDir || file.startsWith(`${appDir}/`)
            );

          const shouldBuildAll =
            fullBuild ||
            changedFiles.some(
              (file) =>
                matchesAnyInput(file, globalInputs) ||
                globalPrefixes.some((prefix) => file.startsWith(prefix)) ||
                isSharedInputFile(file)
            );

          const selectedDeliverables = shouldBuildAll
            ? deliverables
            : deliverables.filter((deliverable) =>
                changedFiles.some(
                  (file) =>
                    file === deliverable.appDir || file.startsWith(`${deliverable.appDir}/`)
                )
              );
          const sourceServicesForDeliverables = new Set(
            selectedDeliverables.map((deliverable) => deliverable.sourceService).filter(Boolean)
          );
          const selected = shouldBuildAll
            ? services
            : services.filter(
                (service) =>
                  sourceServicesForDeliverables.has(service.name) ||
                  changedFiles.some(
                    (file) => file === service.appDir || file.startsWith(`${service.appDir}/`)
                  )
              );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `services=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `deliverables=${JSON.stringify(selectedDeliverables)}\n`
          );
          NODE

  build:
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        run: |
          set -euo pipefail

          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:sha-${{ env.JUANIE_SOURCE_SHA }}
          BUILD_STRATEGY="${{ matrix.service.build.strategy }}"
          BUILD_DEFINITION="${{ matrix.service.build.definition }}"
          BUILD_TARGET="${{ matrix.service.build.target }}"
          BUILD_CONTEXT="${{ matrix.service.build.context }}"
          BUILD_DOCKERFILE="${{ matrix.service.build.dockerfile }}"

          if [ -z "$BUILD_TARGET" ]; then
            BUILD_TARGET="${{ matrix.service.name }}"
          fi

          if [ -z "$BUILD_DOCKERFILE" ]; then
            BUILD_DOCKERFILE="${{ matrix.service.appDir }}/Dockerfile"
          fi

          if [ -z "$BUILD_CONTEXT" ]; then
            BUILD_CONTEXT='.'
          fi

          if [ "$BUILD_STRATEGY" = 'bake' ] && [ -n "$BUILD_DEFINITION" ]; then
            docker buildx bake "$BUILD_TARGET" \
              -f "$BUILD_DEFINITION" \
              --set "$BUILD_TARGET.tags=$IMAGE_TAG" \
              --set "$BUILD_TARGET.args.GIT_SHA=${{ env.JUANIE_SOURCE_SHA }}" \
              --push
          else
            docker build -t "$IMAGE_TAG" -f "$BUILD_DOCKERFILE" "$BUILD_CONTEXT"
            docker push "$IMAGE_TAG"
          fi

      - name: Trigger Juanie Release
        if: success()
        run: |
          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:sha-${{ env.JUANIE_SOURCE_SHA }}
          RELEASE_RESPONSE_FILE="$(mktemp)"
          RELEASE_STATUS=$(curl -sS -o "$RELEASE_RESPONSE_FILE" -w '%{http_code}' -X POST "https://juanie.art/api/releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "sha": "${{ env.JUANIE_SOURCE_SHA }}",
              "ref": "${{ env.JUANIE_RELEASE_REF }}",
              "services": [
                {
                  "name": "${{ matrix.service.name }}",
                  "image": "'"$IMAGE_TAG"'"
                }
              ]
            }')
          RELEASE_RESPONSE="$(cat "$RELEASE_RESPONSE_FILE")"
          rm -f "$RELEASE_RESPONSE_FILE"

          echo "$RELEASE_RESPONSE"

          if [ "$RELEASE_STATUS" -lt 200 ] || [ "$RELEASE_STATUS" -ge 300 ]; then
            echo "Juanie release request failed with HTTP ${RELEASE_STATUS}"
            exit 1
          fi

          RELEASE_ID=$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.release.id')
          RELEASE_PATH=$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.release.releasePath // empty')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = 'null' ]; then
            echo 'Juanie did not return a release id'
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          for attempt in $(seq 1 180); do
            STATUS_RESPONSE=$(curl -fsS "https://juanie.art/api/releases/${RELEASE_ID}/status" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

            RESOLUTION=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.resolution')
            STATUS=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.status')
            ERROR_MESSAGE=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.error // empty')

            echo "Juanie release ${RELEASE_ID}: status=${STATUS}"

            case "$RESOLUTION" in
              succeeded)
                exit 0
                ;;
              action_required)
                if [ -n "$RELEASE_PATH" ]; then
                  echo "Juanie release requires manual action: https://juanie.art${RELEASE_PATH}"
                fi
                exit 0
                ;;
              failed)
                echo "Juanie release failed: ${ERROR_MESSAGE:-unknown error}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Juanie release ${RELEASE_ID}"
          exit 1

  deliver:
    needs:
      - detect
      - build
    if: ${{ needs.detect.outputs.deliverables != '[]' }}
    strategy:
      matrix:
        deliverable: ${{ fromJson(needs.detect.outputs.deliverables) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source release
        id: release
        env:
          JUANIE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          source_service='${{ matrix.deliverable.sourceService }}'
          image_tag=${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/${source_service}:sha-${{ env.JUANIE_SOURCE_SHA }}
          release_services_json="$(jq -cn --arg name "$source_service" --arg image "$image_tag" '[{name: $name, image: $image}]')"
          lookup_payload="$(
            jq -cn \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg sha "${JUANIE_SOURCE_SHA}" \
              --arg ref "${JUANIE_RELEASE_REF}" \
              --arg service "$source_service" \
              '{repository: $repository, sha: $sha, ref: $ref, service: $service}'
          )"

          lookup_response="$(
            curl -fsSL -X POST "https://juanie.art/api/releases/lookup" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${JUANIE_TOKEN}" \
              -d "$lookup_payload"
          )"

          release_id="$(printf '%s' "$lookup_response" | jq -r '.release.id')"
          release_path="$(printf '%s' "$lookup_response" | jq -r '.release.releasePath // empty')"
          status="$(printf '%s' "$lookup_response" | jq -r '.release.status')"
          [ -n "$release_id" ] && [ "$release_id" != "null" ] || {
            echo 'Juanie release lookup did not return a release id'
            exit 1
          }

          case "$status" in
            succeeded|awaiting_rollout)
              echo "artifacts_ready=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Juanie release ${release_id} is ${status}; delivery artifact extraction is not allowed"
              if [ -n "$release_path" ]; then
                echo "Release detail: https://juanie.art${release_path}"
              fi
              exit 1
              ;;
          esac

          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          {
            echo "release_services_json<<JUANIE_RELEASE_SERVICES"
            echo "$release_services_json"
            echo "JUANIE_RELEASE_SERVICES"
          } >> "$GITHUB_OUTPUT"

      - name: Extract and Register Delivery Artifact
        if: ${{ steps.release.outputs.artifacts_ready == 'true' }}
        env:
          JUANIE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUANIE_RELEASE_ID: ${{ steps.release.outputs.release_id }}
          JUANIE_REPOSITORY: ${{ github.repository }}
          JUANIE_RELEASE_SERVICES_JSON: ${{ steps.release.outputs.release_services_json }}
        run: |
          set -euo pipefail
          jq -n --argjson item '${{ toJson(matrix.deliverable) }}' '[$item]' > .juanie-deliverables.json
          JUANIE_DELIVERABLES_FILE=.juanie-deliverables.json bash .juanie/delivery-artifacts.sh
