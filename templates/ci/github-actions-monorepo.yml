name: Juanie CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      juanie_source_sha:
        description: Source commit SHA to build
        required: false
        type: string
      juanie_release_ref:
        description: Logical release ref to send back to Juanie
        required: false
        type: string
      juanie_force_full_build:
        description: Build all services for preview startup
        required: false
        type: string

env:
  IMAGE_REGISTRY: ghcr.io
  JUANIE_SOURCE_SHA: ${{ inputs.juanie_source_sha || github.sha }}
  JUANIE_RELEASE_REF: ${{ inputs.juanie_release_ref || github.ref }}
  JUANIE_FORCE_FULL_BUILD: ${{ inputs.juanie_force_full_build || 'false' }}
  JUANIE_SERVICE_MATRIX_B64: {{JUANIE_SERVICE_MATRIX_B64}}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - name: Detect affected services
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execSync } = require('node:child_process');

          const services = JSON.parse(
            Buffer.from(process.env.JUANIE_SERVICE_MATRIX_B64 ?? '', 'base64').toString('utf8')
          );
          const serviceDirs = services.map((service) => service.appDir);
          const globalFiles = new Set([
            'package.json',
            'pnpm-lock.yaml',
            'yarn.lock',
            'package-lock.json',
            'bun.lock',
            'bun.lockb',
            'turbo.json',
            'juanie.yaml',
            'juanie.yml',
            'docker-bake.hcl',
            'docker-bake.json',
          ]);
          const globalPrefixes = ['.github/', '.gitlab/'];
          const beforeSha = process.env.BEFORE_SHA;
          const sourceSha = process.env.JUANIE_SOURCE_SHA;
          const fullBuild =
            process.env.JUANIE_FORCE_FULL_BUILD === 'true' ||
            !beforeSha ||
            /^0+$/.test(beforeSha);
          let changedFiles = [];

          if (!fullBuild) {
            const output = execSync(`git diff --name-only ${beforeSha} ${sourceSha}`, {
              encoding: 'utf8',
            });
            changedFiles = output.split('\n').map((line) => line.trim()).filter(Boolean);
          }

          const isSharedPackageFile = (file) =>
            file.startsWith('packages/') &&
            !serviceDirs.some((appDir) => file === appDir || file.startsWith(`${appDir}/`));

          const shouldBuildAll =
            fullBuild ||
            changedFiles.some(
              (file) =>
                globalFiles.has(file) ||
                globalPrefixes.some((prefix) => file.startsWith(prefix)) ||
                isSharedPackageFile(file)
            );

          const selected = shouldBuildAll
            ? services
            : services.filter((service) =>
                changedFiles.some(
                  (file) => file === service.appDir || file.startsWith(`${service.appDir}/`)
                )
              );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `services=${JSON.stringify(selected)}\n`);
          NODE

  build:
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        run: |
          set -euo pipefail

          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:sha-${{ env.JUANIE_SOURCE_SHA }}
          BUILD_STRATEGY="${{ matrix.service.build.strategy }}"
          BUILD_DEFINITION="${{ matrix.service.build.definition }}"
          BUILD_TARGET="${{ matrix.service.build.target }}"
          BUILD_CONTEXT="${{ matrix.service.build.context }}"
          BUILD_DOCKERFILE="${{ matrix.service.build.dockerfile }}"

          if [ -z "$BUILD_TARGET" ]; then
            BUILD_TARGET="${{ matrix.service.name }}"
          fi

          if [ -z "$BUILD_DOCKERFILE" ]; then
            BUILD_DOCKERFILE="${{ matrix.service.appDir }}/Dockerfile"
          fi

          if [ -z "$BUILD_CONTEXT" ]; then
            BUILD_CONTEXT='.'
          fi

          if [ "$BUILD_STRATEGY" = 'bake' ] && [ -n "$BUILD_DEFINITION" ]; then
            docker buildx bake "$BUILD_TARGET" \
              -f "$BUILD_DEFINITION" \
              --set "$BUILD_TARGET.tags=$IMAGE_TAG" \
              --set "$BUILD_TARGET.args.GIT_SHA=${{ env.JUANIE_SOURCE_SHA }}" \
              --push
          else
            docker build -t "$IMAGE_TAG" -f "$BUILD_DOCKERFILE" "$BUILD_CONTEXT"
            docker push "$IMAGE_TAG"
          fi

      - name: Trigger Juanie Release
        if: success()
        run: |
          IMAGE_TAG=${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}:sha-${{ env.JUANIE_SOURCE_SHA }}
          RELEASE_RESPONSE_FILE="$(mktemp)"
          RELEASE_STATUS=$(curl -sS -o "$RELEASE_RESPONSE_FILE" -w '%{http_code}' -X POST "https://juanie.art/api/releases" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "sha": "${{ env.JUANIE_SOURCE_SHA }}",
              "ref": "${{ env.JUANIE_RELEASE_REF }}",
              "services": [
                {
                  "name": "${{ matrix.service.name }}",
                  "image": "'"$IMAGE_TAG"'"
                }
              ]
            }')
          RELEASE_RESPONSE="$(cat "$RELEASE_RESPONSE_FILE")"
          rm -f "$RELEASE_RESPONSE_FILE"

          echo "$RELEASE_RESPONSE"

          if [ "$RELEASE_STATUS" -lt 200 ] || [ "$RELEASE_STATUS" -ge 300 ]; then
            echo "Juanie release request failed with HTTP ${RELEASE_STATUS}"
            exit 1
          fi

          RELEASE_ID=$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.release.id')
          RELEASE_PATH=$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.release.releasePath // empty')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = 'null' ]; then
            echo 'Juanie did not return a release id'
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          for attempt in $(seq 1 180); do
            STATUS_RESPONSE=$(curl -fsS "https://juanie.art/api/releases/${RELEASE_ID}/status" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

            RESOLUTION=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.resolution')
            STATUS=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.status')
            ERROR_MESSAGE=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.error // empty')

            echo "Juanie release ${RELEASE_ID}: status=${STATUS}"

            case "$RESOLUTION" in
              succeeded)
                exit 0
                ;;
              action_required)
                if [ -n "$RELEASE_PATH" ]; then
                  echo "Juanie release requires manual action: https://juanie.art${RELEASE_PATH}"
                fi
                exit 0
                ;;
              failed)
                echo "Juanie release failed: ${ERROR_MESSAGE:-unknown error}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Juanie release ${RELEASE_ID}"
          exit 1
