name: Juanie CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      juanie_source_sha:
        description: Source commit SHA to build
        required: false
        type: string
      juanie_release_ref:
        description: Logical release ref to send back to Juanie
        required: false
        type: string
      juanie_force_full_build:
        description: Build all services for preview startup
        required: false
        type: string

env:
  IMAGE_REGISTRY: ghcr.io
  JUANIE_SOURCE_SHA: ${{ inputs.juanie_source_sha || github.sha }}
  JUANIE_RELEASE_REF: ${{ inputs.juanie_release_ref || github.ref }}
  JUANIE_FORCE_FULL_BUILD: ${{ inputs.juanie_force_full_build || 'false' }}
  JUANIE_SERVICE_MATRIX_B64: {{JUANIE_SERVICE_MATRIX_B64}}
  JUANIE_DELIVERABLE_MATRIX_B64: {{JUANIE_DELIVERABLE_MATRIX_B64}}
  JUANIE_AFFECTED_RULES_B64: {{JUANIE_AFFECTED_RULES_B64}}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      deliverables: ${{ steps.detect.outputs.deliverables }}
      service_names: ${{ steps.detect.outputs.service_names }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - name: Detect affected services
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execSync } = require('node:child_process');

          const services = JSON.parse(
            Buffer.from(process.env.JUANIE_SERVICE_MATRIX_B64 ?? '', 'base64').toString('utf8')
          );
          const deliverables = JSON.parse(
            Buffer.from(process.env.JUANIE_DELIVERABLE_MATRIX_B64 ?? '', 'base64').toString('utf8')
          );
          const affectedRules = JSON.parse(
            Buffer.from(process.env.JUANIE_AFFECTED_RULES_B64 ?? '', 'base64').toString('utf8')
          );
          const serviceDirs = services.map((service) => service.appDir);
          const deliverableDirs = deliverables.map((deliverable) => deliverable.appDir);
          const globalInputs = affectedRules.global ?? [];
          const sharedInputs = affectedRules.inputs ?? [];
          const globalPrefixes = ['.github/', '.gitlab/'];
          const beforeSha = process.env.BEFORE_SHA;
          const sourceSha = process.env.JUANIE_SOURCE_SHA;
          const fullBuild =
            process.env.JUANIE_FORCE_FULL_BUILD === 'true' ||
            !beforeSha ||
            /^0+$/.test(beforeSha);
          let changedFiles = [];

          if (!fullBuild) {
            const output = execSync(`git diff --name-only ${beforeSha} ${sourceSha}`, {
              encoding: 'utf8',
            });
            changedFiles = output.split('\n').map((line) => line.trim()).filter(Boolean);
          }

          const matchesInput = (file, pattern) => {
            if (!pattern) return false;
            if (pattern.endsWith('/**')) return file.startsWith(pattern.slice(0, -2));
            if (pattern.endsWith('/*')) {
              const prefix = pattern.slice(0, -1);
              return file.startsWith(prefix) && !file.slice(prefix.length).includes('/');
            }
            if (pattern.endsWith('/')) return file.startsWith(pattern);
            return file === pattern;
          };

          const matchesAnyInput = (file, patterns) =>
            patterns.some((pattern) => matchesInput(file, pattern));

          const isSharedInputFile = (file) =>
            matchesAnyInput(file, sharedInputs) &&
            ![...serviceDirs, ...deliverableDirs].some(
              (appDir) => file === appDir || file.startsWith(`${appDir}/`)
            );

          const shouldBuildAll =
            fullBuild ||
            changedFiles.some(
              (file) =>
                matchesAnyInput(file, globalInputs) ||
                globalPrefixes.some((prefix) => file.startsWith(prefix)) ||
                isSharedInputFile(file)
            );

          const selectedDeliverables = shouldBuildAll
            ? deliverables
            : deliverables.filter((deliverable) =>
                changedFiles.some(
                  (file) =>
                    file === deliverable.appDir || file.startsWith(`${deliverable.appDir}/`)
                )
              );
          const sourceServicesForDeliverables = new Set(
            selectedDeliverables.map((deliverable) => deliverable.sourceService).filter(Boolean)
          );
          const selected = shouldBuildAll
            ? services
            : services.filter(
                (service) =>
                  sourceServicesForDeliverables.has(service.name) ||
                  changedFiles.some(
                    (file) => file === service.appDir || file.startsWith(`${service.appDir}/`)
                  )
              );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `services=${JSON.stringify(selected)}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `deliverables=${JSON.stringify(selectedDeliverables)}\n`
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `service_names=${JSON.stringify(selected.map((service) => service.name))}\n`
          );
          NODE

  plan:
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_run_id: ${{ steps.plan.outputs.build_run_id }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - name: Start Juanie Build Run
        id: plan
        env:
          JUANIE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUANIE_REPOSITORY: ${{ github.repository }}
          JUANIE_PROVIDER: github
          JUANIE_IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          JUANIE_EXTERNAL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          JUANIE_SELECTED_SERVICES_JSON: ${{ needs.detect.outputs.service_names }}
        run: |
          set -euo pipefail

          bash .juanie/build-run.sh start

          echo "build_run_id=$(cat .juanie/build-run/build-run-id)" >> "$GITHUB_OUTPUT"
          {
            echo 'groups<<JUANIE_BUILD_GROUPS'
            cat .juanie/build-run/groups.json
            echo 'JUANIE_BUILD_GROUPS'
          } >> "$GITHUB_OUTPUT"

      - name: Upload Juanie Build Plan
        uses: actions/upload-artifact@v4
        with:
          name: juanie-build-run-${{ steps.plan.outputs.build_run_id }}
          path: .juanie/build-run
          if-no-files-found: error
          retention-days: 1

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: .juanie/build-run

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Group
        env:
          JUANIE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUANIE_BUILD_RUN_ID: ${{ needs.plan.outputs.build_run_id }}
          JUANIE_BUILD_GROUP_JSON: ${{ toJson(matrix.group) }}
          JUANIE_DOCKER_CACHE_BACKEND: gha
        run: bash .juanie/build-run.sh build-group

  release:
    needs:
      - plan
      - build
    if: ${{ always() && needs.plan.outputs.build_run_id != '' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      artifacts_ready: ${{ steps.release.outputs.artifacts_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: .juanie/build-run

      - name: Finalize Juanie Build Run
        id: release
        env:
          JUANIE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUANIE_BUILD_RUN_ID: ${{ needs.plan.outputs.build_run_id }}
        run: |
          set -euo pipefail

          bash .juanie/build-run.sh finalize

          echo "release_id=$(cat .juanie/build-run/release-id)" >> "$GITHUB_OUTPUT"
          echo "artifacts_ready=$(cat .juanie/build-run/artifacts-ready)" >> "$GITHUB_OUTPUT"

  deliver:
    needs:
      - detect
      - plan
      - release
    if: ${{ needs.detect.outputs.deliverables != '[]' && needs.release.outputs.artifacts_ready == 'true' }}
    strategy:
      matrix:
        deliverable: ${{ fromJson(needs.detect.outputs.deliverables) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.JUANIE_SOURCE_SHA }}

      - uses: actions/download-artifact@v4
        with:
          name: juanie-build-run-${{ needs.plan.outputs.build_run_id }}
          path: .juanie/build-run

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and Register Delivery Artifact
        env:
          JUANIE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JUANIE_RELEASE_ID: ${{ needs.release.outputs.release_id }}
          JUANIE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          jq -n --argjson item '${{ toJson(matrix.deliverable) }}' '[$item]' > .juanie-deliverables.json
          export JUANIE_RELEASE_SERVICES_JSON="$(cat .juanie/build-run/release-services.json)"
          JUANIE_DELIVERABLES_FILE=.juanie-deliverables.json bash .juanie/delivery-artifacts.sh
