stages:
  - detect
  - build
  - deliver

variables:
  REGISTRY: $CI_REGISTRY
  JUANIE_SERVICE_MATRIX_B64: {{JUANIE_SERVICE_MATRIX_B64}}
  JUANIE_DELIVERABLE_MATRIX_B64: {{JUANIE_DELIVERABLE_MATRIX_B64}}
  JUANIE_AFFECTED_RULES_B64: {{JUANIE_AFFECTED_RULES_B64}}

detect:
  stage: detect
  image: oven/bun:1
  script:
    - |
      bun <<'BUN'
      import { execSync } from 'node:child_process';
      import { writeFileSync } from 'node:fs';

      const services = JSON.parse(
        Buffer.from(process.env.JUANIE_SERVICE_MATRIX_B64 ?? '', 'base64').toString('utf8')
      );
      const deliverables = JSON.parse(
        Buffer.from(process.env.JUANIE_DELIVERABLE_MATRIX_B64 ?? '', 'base64').toString('utf8')
      );
      const affectedRules = JSON.parse(
        Buffer.from(process.env.JUANIE_AFFECTED_RULES_B64 ?? '', 'base64').toString('utf8')
      );
      const serviceDirs = services.map((service) => service.appDir);
      const deliverableDirs = deliverables.map((deliverable) => deliverable.appDir);
      const globalInputs = affectedRules.global ?? [];
      const sharedInputs = affectedRules.inputs ?? [];
      const globalPrefixes = ['.github/', '.gitlab/'];
      const beforeSha = process.env.CI_COMMIT_BEFORE_SHA;
      const sourceSha = process.env.JUANIE_SOURCE_SHA || process.env.CI_COMMIT_SHA;
      const fullBuild =
        process.env.JUANIE_FORCE_FULL_BUILD === '1' ||
        !beforeSha ||
        /^0+$/.test(beforeSha);
      let changedFiles = [];

      if (!fullBuild) {
        const output = execSync(`git diff --name-only ${beforeSha} ${sourceSha}`, {
          encoding: 'utf8',
        });
        changedFiles = output.split('\n').map((line) => line.trim()).filter(Boolean);
      }

      const matchesInput = (file, pattern) => {
        if (!pattern) return false;
        if (pattern.endsWith('/**')) return file.startsWith(pattern.slice(0, -2));
        if (pattern.endsWith('/*')) {
          const prefix = pattern.slice(0, -1);
          return file.startsWith(prefix) && !file.slice(prefix.length).includes('/');
        }
        if (pattern.endsWith('/')) return file.startsWith(pattern);
        return file === pattern;
      };

      const matchesAnyInput = (file, patterns) =>
        patterns.some((pattern) => matchesInput(file, pattern));

      const isSharedInputFile = (file) =>
        matchesAnyInput(file, sharedInputs) &&
        ![...serviceDirs, ...deliverableDirs].some(
          (appDir) => file === appDir || file.startsWith(`${appDir}/`)
        );

      const shouldBuildAll =
        fullBuild ||
        changedFiles.some(
          (file) =>
            matchesAnyInput(file, globalInputs) ||
            globalPrefixes.some((prefix) => file.startsWith(prefix)) ||
            isSharedInputFile(file)
        );

      const selectedDeliverables = shouldBuildAll
        ? deliverables
        : deliverables.filter((deliverable) =>
            changedFiles.some(
              (file) => file === deliverable.appDir || file.startsWith(`${deliverable.appDir}/`)
            )
          );
      const sourceServicesForDeliverables = new Set(
        selectedDeliverables.map((deliverable) => deliverable.sourceService).filter(Boolean)
      );
      const selected = shouldBuildAll
        ? services
        : services.filter(
            (service) =>
              sourceServicesForDeliverables.has(service.name) ||
              changedFiles.some(
                (file) => file === service.appDir || file.startsWith(`${service.appDir}/`)
              )
          );

      writeFileSync('services.json', JSON.stringify(selected));
      writeFileSync('service-names.json', JSON.stringify(selected.map((service) => service.name)));
      writeFileSync('deliverables.json', JSON.stringify(selectedDeliverables));
      BUN
  artifacts:
    paths:
      - services.json
      - service-names.json
      - deliverables.json

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: detect
      artifacts: true
  before_script:
    - apk add --no-cache bash curl jq
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail

      if [ "$(cat services.json)" = '[]' ]; then
        echo 'No affected services'
        exit 0
      fi

      export JUANIE_SOURCE_SHA="${JUANIE_SOURCE_SHA:-$CI_COMMIT_SHA}"
      export JUANIE_RELEASE_REF="${JUANIE_RELEASE_REF:-$CI_COMMIT_REF_NAME}"
      export JUANIE_REPOSITORY="$CI_PROJECT_PATH"
      export JUANIE_PROVIDER="gitlab"
      export JUANIE_IMAGE_REGISTRY="$CI_REGISTRY"
      export JUANIE_EXTERNAL_RUN_ID="$CI_PIPELINE_ID"
      export JUANIE_TOKEN="$CI_JOB_TOKEN"
      export JUANIE_SELECTED_SERVICES_JSON="$(cat service-names.json)"

      bash .juanie/build-run.sh start
      bash .juanie/build-run.sh build-all
      bash .juanie/build-run.sh finalize

      cp .juanie/build-run/release-id .juanie-release-id
      cp .juanie/build-run/release-services.json .juanie-release-services.json
      cp .juanie/build-run/artifacts-ready .juanie-artifacts-ready
      cp -r .juanie/build-run .juanie-build-run
  artifacts:
    paths:
      - .juanie-release-id
      - .juanie-release-services.json
      - .juanie-artifacts-ready
      - .juanie-build-run
  rules:
    - if: $CI_PIPELINE_SOURCE

deliver:
  stage: deliver
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: detect
      artifacts: true
    - job: build
      optional: true
      artifacts: true
  before_script:
    - apk add --no-cache bash curl jq ruby tar zip
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail

      if [ ! -f .juanie-artifacts-ready ] || [ "$(cat .juanie-artifacts-ready)" != "true" ]; then
        echo 'Release is not ready for delivery artifact extraction'
        exit 0
      fi

      DELIVERABLES_JSON="$(cat deliverables.json)"
      if [ "$DELIVERABLES_JSON" = '[]' ]; then
        echo 'No affected deliverables'
        exit 0
      fi

      printf '%s' "$DELIVERABLES_JSON" | jq -c '.[]' | while IFS= read -r DELIVERABLE; do
        printf '%s' "$DELIVERABLE" | jq -c '[.]' > .juanie-deliverables.json
        JUANIE_TOKEN="$CI_JOB_TOKEN" \
          JUANIE_RELEASE_ID="$(cat .juanie-release-id)" \
          JUANIE_REPOSITORY="$CI_PROJECT_PATH" \
          JUANIE_RELEASE_SERVICES_JSON="$(cat .juanie-release-services.json)" \
          JUANIE_DELIVERABLES_FILE=.juanie-deliverables.json \
          bash .juanie/delivery-artifacts.sh
      done
  rules:
    - if: $CI_PIPELINE_SOURCE
