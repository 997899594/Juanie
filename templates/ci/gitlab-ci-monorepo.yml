stages:
  - detect
  - build
  - deliver

variables:
  REGISTRY: $CI_REGISTRY
  JUANIE_SERVICE_MATRIX_B64: {{JUANIE_SERVICE_MATRIX_B64}}
  JUANIE_DELIVERABLE_MATRIX_B64: {{JUANIE_DELIVERABLE_MATRIX_B64}}
  JUANIE_AFFECTED_RULES_B64: {{JUANIE_AFFECTED_RULES_B64}}

detect:
  stage: detect
  image: node:24-bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - corepack enable
  script:
    - node .juanie/affected-workspace.mjs
  artifacts:
    paths:
      - services.json
      - service-names.json
      - deliverables.json

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: detect
      artifacts: true
  before_script:
    - apk add --no-cache bash curl jq
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail

      if [ "$(cat services.json)" = '[]' ]; then
        echo 'No affected services'
        exit 0
      fi

      export JUANIE_SOURCE_SHA="${JUANIE_SOURCE_SHA:-$CI_COMMIT_SHA}"
      export JUANIE_RELEASE_REF="${JUANIE_RELEASE_REF:-$CI_COMMIT_REF_NAME}"
      export JUANIE_REPOSITORY="$CI_PROJECT_PATH"
      export JUANIE_PROVIDER="gitlab"
      export JUANIE_IMAGE_REGISTRY="$CI_REGISTRY"
      export JUANIE_EXTERNAL_RUN_ID="$CI_PIPELINE_ID"
      export JUANIE_TOKEN="$CI_JOB_TOKEN"
      export JUANIE_SELECTED_SERVICES_JSON="$(cat service-names.json)"

      bash .juanie/build-run.sh start
      bash .juanie/build-run.sh build-all
      bash .juanie/build-run.sh finalize

      cp .juanie/build-run/release-id .juanie-release-id
      cp .juanie/build-run/release-services.json .juanie-release-services.json
      cp .juanie/build-run/artifacts-ready .juanie-artifacts-ready
      cp -r .juanie/build-run .juanie-build-run
  artifacts:
    paths:
      - .juanie-release-id
      - .juanie-release-services.json
      - .juanie-artifacts-ready
      - .juanie-build-run
  rules:
    - if: $CI_PIPELINE_SOURCE

deliver:
  stage: deliver
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - job: detect
      artifacts: true
    - job: build
      optional: true
      artifacts: true
  before_script:
    - apk add --no-cache bash curl jq ruby tar zip
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail

      if [ ! -f .juanie-artifacts-ready ] || [ "$(cat .juanie-artifacts-ready)" != "true" ]; then
        echo 'Release is not ready for delivery artifact extraction'
        exit 0
      fi

      DELIVERABLES_JSON="$(cat deliverables.json)"
      if [ "$DELIVERABLES_JSON" = '[]' ]; then
        echo 'No affected deliverables'
        exit 0
      fi

      printf '%s' "$DELIVERABLES_JSON" | jq -c '.[]' | while IFS= read -r DELIVERABLE; do
        printf '%s' "$DELIVERABLE" | jq -c '[.]' > .juanie-deliverables.json
        JUANIE_TOKEN="$CI_JOB_TOKEN" \
          JUANIE_RELEASE_ID="$(cat .juanie-release-id)" \
          JUANIE_REPOSITORY="$CI_PROJECT_PATH" \
          JUANIE_RELEASE_SERVICES_JSON="$(cat .juanie-release-services.json)" \
          JUANIE_DELIVERABLES_FILE=.juanie-deliverables.json \
          bash .juanie/delivery-artifacts.sh
      done
  rules:
    - if: $CI_PIPELINE_SOURCE
