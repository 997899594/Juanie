stages:
  - detect
  - build
  - deliver

variables:
  REGISTRY: $CI_REGISTRY
  JUANIE_SERVICE_MATRIX_B64: {{JUANIE_SERVICE_MATRIX_B64}}
  JUANIE_DELIVERABLE_MATRIX_B64: {{JUANIE_DELIVERABLE_MATRIX_B64}}
  JUANIE_AFFECTED_RULES_B64: {{JUANIE_AFFECTED_RULES_B64}}

detect:
  stage: detect
  image: oven/bun:1
  script:
    - |
      bun <<'BUN'
      import { execSync } from 'node:child_process';
      import { writeFileSync } from 'node:fs';

      const services = JSON.parse(
        Buffer.from(process.env.JUANIE_SERVICE_MATRIX_B64 ?? '', 'base64').toString('utf8')
      );
      const deliverables = JSON.parse(
        Buffer.from(process.env.JUANIE_DELIVERABLE_MATRIX_B64 ?? '', 'base64').toString('utf8')
      );
      const affectedRules = JSON.parse(
        Buffer.from(process.env.JUANIE_AFFECTED_RULES_B64 ?? '', 'base64').toString('utf8')
      );
      const serviceDirs = services.map((service) => service.appDir);
      const deliverableDirs = deliverables.map((deliverable) => deliverable.appDir);
      const globalInputs = affectedRules.global ?? [];
      const sharedInputs = affectedRules.inputs ?? [];
      const globalPrefixes = ['.github/', '.gitlab/'];
      const beforeSha = process.env.CI_COMMIT_BEFORE_SHA;
      const sourceSha = process.env.JUANIE_SOURCE_SHA || process.env.CI_COMMIT_SHA;
      const fullBuild =
        process.env.JUANIE_FORCE_FULL_BUILD === '1' ||
        !beforeSha ||
        /^0+$/.test(beforeSha);
      let changedFiles = [];

      if (!fullBuild) {
        const output = execSync(`git diff --name-only ${beforeSha} ${sourceSha}`, {
          encoding: 'utf8',
        });
        changedFiles = output.split('\n').map((line) => line.trim()).filter(Boolean);
      }

      const matchesInput = (file, pattern) => {
        if (!pattern) return false;
        if (pattern.endsWith('/**')) return file.startsWith(pattern.slice(0, -2));
        if (pattern.endsWith('/*')) {
          const prefix = pattern.slice(0, -1);
          return file.startsWith(prefix) && !file.slice(prefix.length).includes('/');
        }
        if (pattern.endsWith('/')) return file.startsWith(pattern);
        return file === pattern;
      };

      const matchesAnyInput = (file, patterns) =>
        patterns.some((pattern) => matchesInput(file, pattern));

      const isSharedInputFile = (file) =>
        matchesAnyInput(file, sharedInputs) &&
        ![...serviceDirs, ...deliverableDirs].some(
          (appDir) => file === appDir || file.startsWith(`${appDir}/`)
        );

      const shouldBuildAll =
        fullBuild ||
        changedFiles.some(
          (file) =>
            matchesAnyInput(file, globalInputs) ||
            globalPrefixes.some((prefix) => file.startsWith(prefix)) ||
            isSharedInputFile(file)
        );

      const selected = shouldBuildAll
        ? services
        : services.filter((service) =>
            changedFiles.some(
              (file) => file === service.appDir || file.startsWith(`${service.appDir}/`)
            )
          );
      const selectedDeliverables = shouldBuildAll
        ? deliverables
        : deliverables.filter((deliverable) =>
            changedFiles.some(
              (file) => file === deliverable.appDir || file.startsWith(`${deliverable.appDir}/`)
            )
          );

      writeFileSync('services.json', JSON.stringify(selected));
      writeFileSync('deliverables.json', JSON.stringify(selectedDeliverables));
      BUN
  artifacts:
    paths:
      - services.json
      - deliverables.json

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache curl jq
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      set -euo pipefail

      SOURCE_SHA="${JUANIE_SOURCE_SHA:-$CI_COMMIT_SHA}"
      RELEASE_REF="${JUANIE_RELEASE_REF:-$CI_COMMIT_REF_NAME}"
      SERVICES_JSON="$(cat services.json)"

      if [ "$SERVICES_JSON" = '[]' ]; then
        echo 'No affected services'
        exit 0
      fi

      for SERVICE in $(printf '%s' "$SERVICES_JSON" | jq -c '.[]'); do
        SERVICE_NAME=$(printf '%s' "$SERVICE" | jq -r '.name')
        BUILD_STRATEGY=$(printf '%s' "$SERVICE" | jq -r '.build.strategy // "dockerfile"')
        BUILD_DEFINITION=$(printf '%s' "$SERVICE" | jq -r '.build.definition // ""')
        BUILD_TARGET=$(printf '%s' "$SERVICE" | jq -r '.build.target // ""')
        BUILD_CONTEXT=$(printf '%s' "$SERVICE" | jq -r '.build.context // "."')
        BUILD_DOCKERFILE=$(printf '%s' "$SERVICE" | jq -r '.build.dockerfile // ""')
        IMAGE_TAG=$CI_REGISTRY_IMAGE/$SERVICE_NAME:sha-$SOURCE_SHA

        if [ -z "$BUILD_TARGET" ]; then
          BUILD_TARGET="$SERVICE_NAME"
        fi

        if [ -z "$BUILD_DOCKERFILE" ]; then
          APP_DIR=$(printf '%s' "$SERVICE" | jq -r '.appDir')
          BUILD_DOCKERFILE="$APP_DIR/Dockerfile"
        fi

        if [ "$BUILD_STRATEGY" = 'bake' ] && [ -n "$BUILD_DEFINITION" ]; then
          docker buildx bake "$BUILD_TARGET" \
            -f "$BUILD_DEFINITION" \
            --set ${BUILD_TARGET}.tags=${IMAGE_TAG} \
            --set ${BUILD_TARGET}.args.GIT_SHA=${SOURCE_SHA} \
            --push
        else
          docker build -t "$IMAGE_TAG" -f "$BUILD_DOCKERFILE" "$BUILD_CONTEXT"
          docker push "$IMAGE_TAG"
        fi

        RELEASE_RESPONSE_FILE="$(mktemp)"
        RELEASE_STATUS=$(curl -sS -o "$RELEASE_RESPONSE_FILE" -w '%{http_code}' -X POST "https://juanie.art/api/releases" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $CI_JOB_TOKEN" \
          -d "{
            \"repository\": \"$CI_PROJECT_PATH\",
            \"sha\": \"$SOURCE_SHA\",
            \"ref\": \"$RELEASE_REF\",
            \"services\": [
              {
                \"name\": \"$SERVICE_NAME\",
                \"image\": \"$IMAGE_TAG\"
              }
            ]
          }")
        RELEASE_RESPONSE="$(cat "$RELEASE_RESPONSE_FILE")"
        rm -f "$RELEASE_RESPONSE_FILE"

        echo "$RELEASE_RESPONSE"

        if [ "$RELEASE_STATUS" -lt 200 ] || [ "$RELEASE_STATUS" -ge 300 ]; then
          echo "Juanie release request failed with HTTP ${RELEASE_STATUS}"
          exit 1
        fi

        RELEASE_ID=$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.release.id')
        RELEASE_PATH=$(printf '%s' "$RELEASE_RESPONSE" | jq -r '.release.releasePath // empty')
        if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = 'null' ]; then
          echo 'Juanie did not return a release id'
          echo "$RELEASE_RESPONSE"
          exit 1
        fi

        for attempt in $(seq 1 180); do
          STATUS_RESPONSE=$(curl -fsS "https://juanie.art/api/releases/${RELEASE_ID}/status" \
            -H "Authorization: Bearer $CI_JOB_TOKEN")

          RESOLUTION=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.resolution')
          STATUS=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.status')
          ERROR_MESSAGE=$(printf '%s' "$STATUS_RESPONSE" | jq -r '.release.error // empty')

          echo "Juanie release ${RELEASE_ID}: status=${STATUS}"

          case "$RESOLUTION" in
            succeeded)
              break
              ;;
            action_required)
              if [ -n "$RELEASE_PATH" ]; then
                echo "Juanie release requires manual action: https://juanie.art${RELEASE_PATH}"
              fi
              break
              ;;
            failed)
              echo "Juanie release failed: ${ERROR_MESSAGE:-unknown error}"
              exit 1
              ;;
          esac

          sleep 10
        done
      done
  rules:
    - if: $CI_PIPELINE_SOURCE

deliver:
  stage: deliver
  image: node:22
  needs:
    - job: detect
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl jq zip && rm -rf /var/lib/apt/lists/*
  script:
    - |
      set -euo pipefail

      DELIVERABLES_JSON="$(cat deliverables.json)"
      if [ "$DELIVERABLES_JSON" = '[]' ]; then
        echo 'No affected deliverables'
        exit 0
      fi

      if [ -f bun.lock ] || [ -f bun.lockb ]; then
        npm install -g bun
        bun install --frozen-lockfile
      elif [ -f pnpm-lock.yaml ]; then
        corepack enable
        pnpm install --frozen-lockfile
      elif [ -f yarn.lock ]; then
        corepack enable
        yarn install --immutable
      elif [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi

      mkdir -p .juanie/deliverables

      printf '%s' "$DELIVERABLES_JSON" | jq -c '.[]' | while IFS= read -r DELIVERABLE; do
        NAME=$(printf '%s' "$DELIVERABLE" | jq -r '.name')
        KIND=$(printf '%s' "$DELIVERABLE" | jq -r '.type')
        APP_DIR=$(printf '%s' "$DELIVERABLE" | jq -r '.appDir // "."')
        VARIANT=$(printf '%s' "$DELIVERABLE" | jq -r '.variant.name')
        PLATFORM=$(printf '%s' "$DELIVERABLE" | jq -r '.variant.platform // .variant.package.platform // "any"')
        FORMAT=$(printf '%s' "$DELIVERABLE" | jq -r '.variant.package.format')
        BUILD_COMMAND=$(printf '%s' "$DELIVERABLE" | jq -r '.variant.build.command // ""')
        SAFE_NAME=$(printf '%s' "$NAME" | tr -cs 'A-Za-z0-9_.-' '-')
        SAFE_VARIANT=$(printf '%s' "$VARIANT" | tr -cs 'A-Za-z0-9_.-' '-')
        SAFE_PLATFORM=$(printf '%s' "$PLATFORM" | tr -cs 'A-Za-z0-9_.-' '-')
        BASE=".juanie/deliverables/${SAFE_NAME}-${SAFE_VARIANT}"
        STAGE="$BASE/stage"
        ARCHIVE="$BASE/${SAFE_NAME}-${SAFE_VARIANT}-${SAFE_PLATFORM}.${FORMAT}"

        rm -rf "$BASE"
        mkdir -p "$STAGE"

        if [ -n "$BUILD_COMMAND" ]; then
          bash -lc "$BUILD_COMMAND"
        fi

        printf '%s' "$DELIVERABLE" | jq -c '.variant.build.outputs // [] | .[]' | while read -r OUTPUT; do
          FROM=$(printf '%s' "$OUTPUT" | jq -r '.from')
          TO=$(printf '%s' "$OUTPUT" | jq -r '.to')
          mkdir -p "$(dirname "$STAGE/$TO")"
          cp -R "$FROM" "$STAGE/$TO"
        done

        if [ -z "$(find "$STAGE" -mindepth 1 -print -quit)" ]; then
          cp -R "$APP_DIR/." "$STAGE"
        fi

        printf '%s' "$DELIVERABLE" | jq -r '.variant.checks // [] | .[].command' | while read -r CHECK_COMMAND; do
          [ -z "$CHECK_COMMAND" ] && continue
          bash -lc "$CHECK_COMMAND"
        done

        case "$FORMAT" in
          tgz|tar.gz)
            tar -czf "$ARCHIVE" -C "$STAGE" .
            ;;
          zip)
            ABS_ARCHIVE="$PWD/$ARCHIVE"
            (cd "$STAGE" && zip -qr "$ABS_ARCHIVE" .)
            ;;
          directory)
            ARCHIVE="$STAGE"
            ;;
          *)
            echo "Unsupported deliverable format: $FORMAT"
            exit 1
            ;;
        esac

        ARTIFACT_URI="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/download"
        RELEASE_PAYLOAD=$(jq -cn \
          --arg repository "$CI_PROJECT_PATH" \
          --arg sha "${JUANIE_SOURCE_SHA:-$CI_COMMIT_SHA}" \
          --arg ref "${JUANIE_RELEASE_REF:-$CI_COMMIT_REF_NAME}" \
          --arg kind "$KIND" \
          --arg name "$NAME" \
          --arg variant "$VARIANT" \
          --arg platform "$PLATFORM" \
          --arg format "$FORMAT" \
          --arg uri "$ARTIFACT_URI" \
          '{
            repository: $repository,
            sha: $sha,
            ref: $ref,
            artifacts: [
              {
                kind: $kind,
                name: $name,
                variant: $variant,
                platform: $platform,
                format: $format,
                uri: $uri
              }
            ]
          }')

        RELEASE_RESPONSE_FILE="$(mktemp)"
        RELEASE_STATUS=$(curl -sS -o "$RELEASE_RESPONSE_FILE" -w '%{http_code}' -X POST "https://juanie.art/api/releases" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $CI_JOB_TOKEN" \
          -d "$RELEASE_PAYLOAD")
        RELEASE_RESPONSE="$(cat "$RELEASE_RESPONSE_FILE")"
        rm -f "$RELEASE_RESPONSE_FILE"

        echo "$RELEASE_RESPONSE"

        if [ "$RELEASE_STATUS" -lt 200 ] || [ "$RELEASE_STATUS" -ge 300 ]; then
          echo "Juanie delivery artifact request failed with HTTP ${RELEASE_STATUS}"
          exit 1
        fi
      done
  artifacts:
    paths:
      - .juanie/deliverables
  rules:
    - if: $CI_PIPELINE_SOURCE
