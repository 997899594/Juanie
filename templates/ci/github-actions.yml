name: Juanie

on:
  push:
    branches: [{{PRODUCTION_BRANCH}}]
  workflow_dispatch:
    inputs:
      juanie_source_sha:
        description: Source commit SHA to build
        required: false
        type: string
      juanie_release_ref:
        description: Logical release ref
        required: false
        type: string
      juanie_force_full_build:
        description: Build the complete declared graph
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  delivery:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: {{JUANIE_GITHUB_REPOSITORY}}/.github/workflows/application-delivery.yml@{{JUANIE_GITHUB_REVISION}}
    with:
      juanie_base_url: {{JUANIE_BASE_URL}}
      source_sha: ${{ inputs.juanie_source_sha || github.sha }}
      release_ref: ${{ inputs.juanie_release_ref || github.ref }}
      force_full_build: ${{ inputs.juanie_force_full_build }}
